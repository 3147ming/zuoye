<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  入口壳：把「按需加载」的逻辑放在这里，不改动上游 games/brain-gym/index.html 一行。
  · 只认 ?game=tetris / snake / mines / breaker / flappy / tiles / plane / bubble / pong
  · 命中则先展示落地页，再动态 inject 上游脚本；上游启动段见到 ?game= 会直接开局
  · 未命中（以及任何异常）立刻整页跳转到上游原文件，行为与改造前完全一致
  这样单个游戏只要解析 ~34KB 的壳，而不是 555KB 的聚合页。
-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>正在进入…</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,#221a33 0%,#0e0b18 60%,#08060f 100%);
    color:#f3e9da;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;text-align:center}
  .ring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,214,170,.22);border-top-color:#ffd6aa;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .t{font-size:15px;letter-spacing:.14em;color:rgba(255,233,208,.82);font-variant-numeric:tabular-nums}
  .s{font-size:12px;letter-spacing:.08em;color:rgba(255,233,208,.42);min-height:1em}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring" aria-hidden="true"></div>
  <div class="t" id="t">正在进入…</div>
  <div class="s" id="s"></div>
</div>
<script>
(function () {
  'use strict';
  var UPSTREAM = 'brain-gym.html';       /* 聚合页本体：首页 / 定级 / 其它玩法 */
  var SHARD_DIR = 'arcade/';              /* 单游戏分片，由 tools/gen-arcade.mjs 生成 */
  var ARCADE = { tetris: 1, snake: 1, mines: 1, flappy: 1, tiles: 1, plane: 1, bubble: 1, pong: 1 };

  var tEl = document.getElementById('t'), sEl = document.getElementById('s');
  var qs = location.search, hash = location.hash;

  function go(url) {
    /* 先让落地页画出来一帧，再跳：避免白屏，也避免用户看不到任何反馈 */
    location.replace(url);
  }

  var id = '';
  try { id = new URLSearchParams(qs).get('game') || ''; } catch (e) { id = ''; }

  /* 非街机 id：首页 / 定级 / 其它玩法，原样交给聚合页 */
  if (!ARCADE[id]) { go(UPSTREAM + qs + hash); return; }

  /* 街机：先确认分片真的存在再跳。fetch 命中 HTTP 缓存时几乎零成本，
     换来的是「分片缺失也不会掉进循环」这条硬保证。 */
  var shardUrl = SHARD_DIR + id + '.html' + qs + hash;
  var done = false;
  function fallback() {
    if (done) return;
    done = true;
    tEl.textContent = '正在打开完整版…';
    go(UPSTREAM + qs + hash);
  }

  var started = Date.now();
  tEl.textContent = '正在进入游戏…';
  setInterval(function () {
    var sec = Math.floor((Date.now() - started) / 1000);
    if (sec >= 2) tEl.textContent = '正在进入游戏 · ' + sec + 's';
  }, 400);

  fetch(SHARD_DIR + id + '.html', { method: 'HEAD', cache: 'force-cache' })
    .then(function (r) {
      if (done) return;
      if (!r || !r.ok) { fallback(); return; }
      done = true;
      setTimeout(function () { location.replace(shardUrl); }, 80);
    })
    .catch(fallback);

  /* 兜底：1.5 秒还没走成（HEAD 被墙、网络挂住）就直接按「分片可能存在」跳 */
  setTimeout(function () {
    if (done) return;
    done = true;
    location.replace(shardUrl);
  }, 1500);
})();
</script>
</body>
</html>
