<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字合并 2048</title>
<link rel="icon" href="data:,">
<style>
  :root { --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #faf8ef; color: #776e65;
    font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4vmin; overflow: hidden; user-select: none; -webkit-user-select: none;
    padding: 2vmin;
  }
  .head { display: flex; align-items: center; gap: 1.4vmin; flex-wrap: wrap; justify-content: center; }
  h1 { margin: 0; font-size: clamp(24px, 5vmin, 48px); font-weight: 800; letter-spacing: .04em; color: #776e65; }
  .scores { display: flex; gap: .6vmin; }
  .sc { background: #bbada0; color: #fff; border-radius: 8px; padding: .5vmin 1vmin; text-align: center; min-width: 74px; }
  .sc b { display: block; font-size: clamp(9px, 1.4vmin, 12px); font-weight: 700; letter-spacing: .1em; opacity: .85; }
  .sc span { font-size: clamp(15px, 2.6vmin, 24px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: .6vmin; align-items: center; }
  button {
    font-family: var(--sans); font-size: clamp(11px, 1.8vmin, 15px); font-weight: 700;
    background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 8px;
    padding: .7vmin 1.4vmin; cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  #sub { font-size: clamp(10px, 1.5vmin, 13px); color: #776e65; opacity: .8; }

  #board {
    width: min(88vw, 460px); aspect-ratio: 1;
    background: #bbada0; border-radius: 12px; padding: 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 10px; touch-action: none;
  }
  .cell { background: rgba(238, 228, 218, .35); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .tile {
    width: 100%; height: 100%; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-variant-numeric: tabular-nums;
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { transform: scale(.7); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  #msg {
    position: fixed; inset: 0; display: none; flex-direction: column; gap: 1.4vmin;
    align-items: center; justify-content: center;
    background: rgba(250, 248, 239, .78); backdrop-filter: blur(3px);
  }
  #msg .m-title { font-size: clamp(22px, 4.4vmin, 42px); font-weight: 800; color: #776e65; }
  .hint { font-size: clamp(10px, 1.5vmin, 13px); color: #776e65; opacity: .7; text-align: center; line-height: 1.8; }
  .hint b { color: #8f7a66; }
</style>
</head>
<body>
<div class="head">
  <h1>2048</h1>
  <div class="scores">
    <div class="sc"><b>分数</b><span id="score">0</span></div>
    <div class="sc"><b>最高分</b><span id="best">0</span></div>
  </div>
  <div class="tools">
    <button id="btn-undo">撤销</button>
    <button id="btn-new">新游戏</button>
  </div>
</div>
<div id="sub">目标 2048</div>
<div id="board"><div id="grid" style="display:contents"></div></div>
<div class="hint">
  <b>← → ↑ ↓</b> 或 <b>W A S D</b> 滑动合并 · 手机直接滑<br>
  相同数字碰一起就相加，<b>U</b> 撤销一步 · <b>N</b> 重开
</div>

<div id="msg">
  <div class="m-title"></div>
  <button>新游戏</button>
</div>

<script src="js/game2048.js"></script>
</body>
</html>
