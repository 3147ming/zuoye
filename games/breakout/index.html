<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>打砖块</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <link href="breakout.css" media="screen, print" rel="stylesheet" type="text/css" />
</head>

<body>

  <div id="breakout">
    <canvas id="canvas">
      <div class='unsupported'>
        抱歉，你的浏览器不支持 &lt;canvas&gt;，这个游戏跑不起来
      </div>
    </canvas>
    <div id="levels">
      <img id="next" class="disabled" src="images/up.png"   title="下一关">
      <img id="prev" class="disabled" src="images/down.png" title="上一关">
      <span id="label">关卡：</span><span id="level"></span>
    </div>
    <div id="controls">
      <input id='sound' type='checkbox' />
      <label for='sound'>音效</label>
    </div>
    <div id="instructions" style='display:none;'>
      <div class='keyboard'>
        <b>空格</b> 开始<br>
        <b>左右键</b> 移动挡板<br>
        <b>上下键</b> 切换关卡
      </div>
      <div class='touch'>
        <b>点击这里</b> 开始<br>
        <b>拖动</b> 移动挡板<br>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="breakout.js"></script>
  <script src="levels.js"></script>
  <script>
  Game.ready(function() {
    var game = Game.start('canvas', Breakout);
  });
  </script>

</body>
</html>
