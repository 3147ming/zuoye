<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>空格键连点</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,540px);height:100%;max-height:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vmin,18px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(14px,3.4vmin,26px)}
h1{margin:0;font-size:clamp(17px,3.4vmin,24px);letter-spacing:.08em}h1 b{color:var(--gold)}
.segs{display:flex;gap:8px} .seg{min-height:42px;min-width:60px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(243,233,218,.72);cursor:pointer;font-size:clamp(12px,2vmin,15px)}
.seg.on{background:rgba(246,193,119,.2);border-color:var(--gold);color:var(--gold)}
.stats{display:flex;gap:clamp(14px,4vmin,34px);color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:clamp(26px,7vmin,42px);color:var(--ink);text-align:center;font-weight:700}
.stats .rate b{color:var(--gold)}
.space{flex:1 1 auto;width:100%;min-height:120px;border-radius:16px;border:1px solid rgba(127,216,200,.35);background:linear-gradient(160deg,rgba(127,216,200,.12),rgba(127,216,200,.04));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform 60ms,background 70ms}
.space:active,.space.press{transform:scale(.985);background:rgba(127,216,200,.24)}
.space .key{font-size:clamp(18px,4vmin,28px);letter-spacing:.2em;color:var(--teal);font-weight:600}
.space .sub{color:var(--dim);font-size:clamp(11px,1.9vmin,13px)}
.reset{min-height:44px;padding:0 22px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(243,233,218,.75);cursor:pointer;font-size:clamp(12px,2vmin,14px)}
</style></head><body><div id="app">
<h1>空格键 <b>连点测试</b></h1>
<div class="segs" id="durs"><button class="seg" data-v="5">5 秒</button><button class="seg on" data-v="10">10 秒</button><button class="seg" data-v="30">30 秒</button></div>
<div class="stats"><span>次数<b id="count">0</b></span><span>剩余<b id="left">10.00s</b></span><span class="rate">速度<b id="rate">0.00</b></span></div>
<div class="space" id="space"><div class="key">SPACE</div><div class="sub" id="msg">按空格开始 · 触屏点这里</div></div>
<div class="stats" style="gap:16px"><span>本地最佳 <b id="best" style="font-size:clamp(16px,3vmin,22px)">—</b></span></div>
<button class="reset" id="reset">重置</button>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var dur=10,count=0,startAt=0,running=false,raf=0;
var best=(function(){try{return Number(localStorage.getItem('ff_space_best')||0)}catch(e){return 0}})();
function showBest(){$('best').textContent=best?best.toFixed(2)+'/s':'—'}
showBest();
var segs=$('durs').querySelectorAll('.seg');for(var i=0;i<segs.length;i++)segs[i].addEventListener('click',function(){for(var j=0;j<segs.length;j++)segs[j].classList.remove('on');this.classList.add('on');dur=Number(this.getAttribute('data-v'));reset()});
function reset(){count=0;running=false;if(raf)cancelAnimationFrame(raf);$('count').textContent='0';$('rate').textContent='0.00';$('left').textContent=dur.toFixed(2)+'s';$('msg').textContent='按空格开始 · 触屏点这里';$('space').classList.remove('press')}
function tick(){if(!running)return;var el=(performance.now()-startAt)/1000,left=Math.max(0,dur-el);$('left').textContent=left.toFixed(2)+'s';$('rate').textContent=(count/Math.max(.01,el)).toFixed(2);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
function hit(){if(!running){running=true;count=1;startAt=performance.now();$('msg').textContent='进行中…';raf=requestAnimationFrame(tick)}else count++;$('count').textContent=count;$('space').classList.add('press');setTimeout(function(){$('space').classList.remove('press')},60)}
function finish(){running=false;if(raf)cancelAnimationFrame(raf);var rate=count/dur;$('rate').textContent=rate.toFixed(2);$('msg').textContent='完成！'+count+' 次 · '+rate.toFixed(2)+'/s';if(rate>best){best=rate;try{localStorage.setItem('ff_space_best',String(best))}catch(e){}showBest()}}
$('space').addEventListener('pointerdown',function(e){e.preventDefault();hit()});
$('reset').addEventListener('click',reset);
document.addEventListener('keydown',function(e){if(e.repeat)return;if(e.code==='Space'){e.preventDefault();hit()}else if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__SPACE={hit:hit,reset:reset,finish:finish,get count(){return count},get running(){return running}};
reset();})();</script></body></html>
