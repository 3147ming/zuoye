<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>发光小鱼</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 100% at 50% 0%,#0d2733,#080d18 70%);color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,560px);height:100%;max-height:780px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);border:1px solid rgba(127,216,200,.2);border-radius:18px;background:rgba(9,16,26,.72);padding:clamp(12px,3vmin,20px)}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--teal)}
.top{display:flex;gap:clamp(14px,4vmin,30px);color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.top b{color:var(--ink)}
.canv{aspect-ratio:1;width:var(--side,100%);max-width:100%;max-height:100%;margin:auto;position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(20,60,80,.4),rgba(8,20,36,.5))}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.msg{color:var(--teal);font-size:clamp(12px,2.1vmin,15px);min-height:1.4em;text-align:center}
.bigbtn{min-height:46px;padding:0 22px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#9fe8dc,#4fc4b0);color:#06231d}
</style></head><body><div id="app">
<h1>发光 <b>小鱼</b></h1>
<div class="top"><span>关卡 <b id="lvl">1</b></span><span>追踪 <b id="nTarget">2</b> 条</span><span>最佳 <b id="best">—</b></span></div>
<div class="canv"><canvas id="cv"></canvas></div>
<div class="msg" id="msg">记住带光圈的小鱼，光圈消失后点它们</div>
<div><button class="bigbtn" id="btn">开始游戏</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var cv=$('cv'),ctx=cv.getContext('2d');var fish=[],targets=[],phase='idle',lvl=1,raf=0,last=0,cueEnd=0,W=0,H=0;
var best=(function(){try{return Number(localStorage.getItem('ff_fish_best')||0)}catch(e){return 0}})();
function showBest(){$('best').textContent=best?('第 '+best+' 关'):'—'}showBest();
function fitCanv(){var c=cv.parentNode,app=document.getElementById('app')||c.parentNode;
  var cs=getComputedStyle(app);
  var padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  var padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  var gap=parseFloat(cs.rowGap)||0;
  var kids=app.children,otherH=0,count=0;
  for(var i=0;i<kids.length;i++){if(kids[i]!==c){otherH+=kids[i].offsetHeight;count++}}
  var availH=app.clientHeight-padY-otherH-gap*(count);
  var availW=app.clientWidth-padX;
  var av=Math.min(availW,availH);
  if(av>0)c.style.setProperty('--side',av+'px')}
function resize(){fitCanv();var dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();W=rect.width;H=rect.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function makeFish(){var count=5+lvl;fish=[];for(let i=0;i<count;i++){var a=Math.random()*Math.PI*2;fish.push({x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*(28+lvl*7),vy:Math.sin(a)*(28+lvl*7),r:Math.min(W,H)*0.045,t:0})}
var nT=Math.min(2+Math.floor(lvl/2),5);var idx=[];while(idx.length<nT){var k=Math.floor(Math.random()*fish.length);if(idx.indexOf(k)<0)idx.push(k)}targets=idx;$('nTarget').textContent=nT}
function draw(now){ctx.clearRect(0,0,W,H);
for(let i=0;i<fish.length;i++){var f=fish[i];f.x+=f.vx*0.016;f.y+=f.vy*0.016;if(f.x<f.r){f.x=f.r;f.vx*=-1}if(f.x>W-f.r){f.x=W-f.r;f.vx*=-1}if(f.y<f.r){f.y=f.r;f.vy*=-1}if(f.y>H-f.r){f.y=H-f.r;f.vy*=-1}
var isT=targets.indexOf(i)>=0;ctx.save();ctx.translate(f.x,f.y);var ang=Math.atan2(f.vy,f.vx);ctx.rotate(ang);
if(phase==='cue'&&isT){ctx.beginPath();ctx.arc(0,0,f.r*1.8,0,Math.PI*2);ctx.strokeStyle='#f6c177';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(0,0,f.r*2.3,0,Math.PI*2);ctx.fillStyle='rgba(246,193,119,.12)';ctx.fill()}
ctx.beginPath();ctx.ellipse(0,0,f.r,f.r*0.62,0,0,Math.PI*2);ctx.fillStyle=isT?'#7fd8c8':'#5b8aa0';ctx.fill();
ctx.beginPath();ctx.moveTo(-f.r,0);ctx.lineTo(-f.r*1.7,-f.r*0.7);ctx.lineTo(-f.r*1.7,f.r*0.7);ctx.closePath();ctx.fillStyle=isT?'#5fc0b0':'#416b80';ctx.fill();
ctx.beginPath();ctx.arc(f.r*0.45,-f.r*0.15,2,0,Math.PI*2);ctx.fillStyle='#0b0914';ctx.fill();ctx.restore()}}
function loop(ts){if(phase!=='cue'&&phase!=='answer')return;if(!last)last=ts;last=ts;draw(ts);
if(phase==='cue'&&ts>cueEnd){phase='answer';$('msg').textContent='光圈消失了！按顺序点刚才发光的小鱼';}
raf=requestAnimationFrame(loop)}
function start(){reset();lvl=1;$('lvl').textContent='1';makeFish();resize();phase='cue';cueEnd=performance.now()+1800;$('btn').textContent='重新开始';$('msg').textContent='记住带光圈的小鱼…';last=0;raf=requestAnimationFrame(loop)}
function reset(){phase='idle';if(raf)cancelAnimationFrame(raf);raf=0;last=0;fish=[];targets=[];draw(0)}
function pointer(e){if(phase!=='answer')return;var rect=cv.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
var hit=-1,bd=1e9;for(let i=0;i<fish.length;i++){var d=Math.hypot(x-fish[i].x,y-fish[i].y);if(d<bd){bd=d;hit=i}}
var need=targets.shift();if(hit===need){if(targets.length===0){lvl++;$('lvl').textContent=lvl;if(lvl>best){best=lvl;try{localStorage.setItem('ff_fish_best',String(best))}catch(e){}showBest()}phase='cue';cueEnd=performance.now()+1500;makeFish();last=0;if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);$('msg').textContent='第 '+lvl+' 关 · 记住新的目标鱼'}else{$('msg').textContent='对！还剩 '+targets.length+' 条'}}else{$('msg').textContent='点错了，再仔细看看';targets.unshift(need)}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();pointer(e)});
$('btn').addEventListener('click',start);window.addEventListener('resize',function(){resize();if(phase==='idle')draw(0)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__FISH={start:start,reset:reset,makeFish:makeFish,pointer:pointer,cue:function(){phase='answer';if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)},get phase(){return phase},get lvl(){return lvl},get targets(){return targets.slice()},get fish(){return fish}};
resize();draw(0);})();</script></body></html>
