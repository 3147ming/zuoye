<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Flanker 侧翼测试</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,560px);height:100%;max-height:740px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.6vmin,20px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(14px,3.4vmin,26px);text-align:center}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--gold)}
.top{display:flex;gap:clamp(14px,4vmin,30px);color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.top b{color:var(--ink)}
.stage{flex:1 1 auto;width:100%;min-height:0;border-radius:16px;background:linear-gradient(160deg,#1c1730,#151126);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.fix{font-size:clamp(28px,7vmin,44px);color:rgba(243,233,218,.3)}
.arrows{font-size:clamp(40px,11vmin,72px);letter-spacing:.08em;font-weight:700;min-height:1.2em}
.ask{color:var(--dim);font-size:clamp(12px,2.1vmin,15px);min-height:1.4em}
.resp{display:flex;gap:12px}.rbtn{min-width:110px;min-height:52px;border-radius:12px;border:1px solid rgba(127,216,200,.4);background:rgba(127,216,200,.12);color:#d8fff5;cursor:pointer;font-size:clamp(14px,2.4vmin,17px)}
.rbtn:active{transform:scale(.96)}
.bigbtn{min-height:46px;padding:0 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}
.res{font-size:clamp(12px,2.1vmin,15px);color:var(--teal);line-height:1.7}
</style></head><body><div id="app">
<h1>Flanker <b>侧翼测试</b></h1>
<div class="top"><span id="stage">练习 1/4</span><span>正确率 <b id="acc">—</b></span><span>平均反应 <b id="rt">—</b></span></div>
<div class="stage"><div class="fix" id="fix">+</div><div class="arrows" id="arrows">← ← ← ← ←</div><div class="ask" id="ask">只看中间箭头方向 · ←或A 左 / →或D 右</div><div class="res" id="res"></div></div>
<div class="resp"><button class="rbtn" id="left">◀ 左</button><button class="rbtn" id="right">右 ▶</button></div>
<div><button class="bigbtn" id="btn">开始（4 练习 + 40 正式）</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var phase='idle',i=0,total=54,practice=4,cur=0,stimAt=0,timeout=null;var rec=[],correct=0,answered=0;
function make(){var dir=Math.random()<.5?-1:1;var type=Math.random();var fl;
if(type<.33)fl=[dir,dir,dir,dir];else if(type<.66)fl=[-dir,-dir,-dir,-dir];else fl=[0,0,0,0];
var all=[fl[0],fl[1],dir,fl[2],fl[3]];return {dir:dir,type:type<.33?'congruent':type<.66?'incongruent':'neutral',all:all}}
function show(){var m=make();cur=m;stimAt=performance.now();$('arrows').textContent=m.all.map(function(d){return d===0?'—':d<0?'←':'→'}).join(' ');$('ask').textContent='只看中间！';$('res').textContent='';
timeout=setTimeout(function(){record(null)},2000)}
function answer(dir){if(phase!=='go')return;var rt=performance.now()-stimAt;if(timeout)clearTimeout(timeout);record(dir,rt)}
function record(dir,rt){phase='gap';if(dir!==null){answered++;var ok=dir===cur.dir;if(ok)correct++;rec.push({type:cur.type,rt:rt,ok:ok})}
i++;if(i===practice){$('ask').textContent='练习结束，正式开始';}
if(i<total){setTimeout(function(){phase='go';show()},350)}else{finish()}
updateTop()}
function updateTop(){$('stage').textContent=i<practice?('练习 '+(i+1)+'/'+practice):('试次 '+(i-practice+1)+'/'+(total-practice));if(answered)$('acc').textContent=Math.round(correct/answered*100)+'%';
var formal=rec.filter(function(r){return r.ok});if(formal.length)$('rt').textContent=Math.round(formal.reduce(function(a,b){return a+b.rt},0)/formal.length)+'ms'}
function finish(){phase='done';$('arrows').textContent='✓';$('ask').textContent='测试完成';var formal=rec.filter(function(r){return r.type!=='neutral'});var con=formal.filter(function(r){return r.type==='congruent'}),inc=formal.filter(function(r){return r.type==='incongruent'});
var ac=con.length?con.reduce(function(a,b){return a+b.rt},0)/con.length:0,ai=inc.length?inc.reduce(function(a,b){return a+b.rt},0)/inc.length:0;
$('res').innerHTML='正式试次正确率 '+Math.round(correct/answered*100)+'%<br>侧翼效应（不一致−一致）：'+Math.round(ai-ac)+'ms<br><span style="opacity:.7">数值越小，抗干扰越好</span>';
$('btn').textContent='再测一次'}
function start(){i=0;rec=[];correct=0;answered=0;phase='go';$('btn').textContent='重新开始';updateTop();show()}
$('left').addEventListener('click',function(){answer(-1)});$('right').addEventListener('click',function(){answer(1)});$('btn').addEventListener('click',function(){if(phase==='idle'||phase==='done')start()});
document.addEventListener('keydown',function(e){if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){answer(-1)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){answer(1)}else if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__FLANKER={start:start,answer:answer,make:make,get phase(){return phase},get cur(){return cur},get i(){return i},get rec(){return rec.slice()}};
})();</script></body></html>
