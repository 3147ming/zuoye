<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>斯特鲁普效应测试</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,560px);height:100%;max-height:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.6vmin,18px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(14px,3.4vmin,24px);text-align:center}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--gold)}
.top{display:flex;gap:clamp(14px,4vmin,30px);color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.top b{color:var(--ink)}
.stage{flex:1 1 auto;width:100%;min-height:0;border-radius:16px;background:linear-gradient(160deg,#1c1730,#151126);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ask{color:var(--dim);font-size:clamp(12px,2.1vmin,15px)}
.word{font-size:clamp(40px,11vmin,76px);font-weight:700;letter-spacing:.08em;min-height:1.2em}
.fb{min-height:1.4em;font-size:clamp(12px,2.1vmin,15px);color:var(--teal)}
.colors{display:flex;gap:clamp(6px,1.6vmin,12px);flex-wrap:wrap;justify-content:center}
.cbtn{width:clamp(48px,12vmin,64px);height:clamp(48px,12vmin,64px);border-radius:12px;border:2px solid rgba(255,255,255,.2);cursor:pointer;position:relative;transition:transform 70ms}
.cbtn:active{transform:scale(.92)}.cbtn small{position:absolute;bottom:-2px;left:0;right:0;font-size:11px;color:rgba(255,255,255,.7)}
.bigbtn{min-height:46px;padding:0 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}
</style></head><body><div id="app">
<h1>斯特鲁普 <b>效应测试</b></h1>
<div class="top"><span>题目 <b id="q">0/20</b></span><span>正确 <b id="ok">0</b></span><span>平均 <b id="avg">—</b></span></div>
<div class="stage"><div class="ask">说出文字的<b>墨水颜色</b>，不是字义</div><div class="word" id="word">准备</div><div class="fb" id="fb"></div></div>
<div class="colors" id="colors"></div>
<div><button class="bigbtn" id="btn">开始测试（20 题）</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var words=['红','蓝','绿','黄','紫','橙'];var colors=['#ff5b5b','#5b9dff','#4fd08a','#f6c177','#c08bff','#ff9d5b'];var names=['红','蓝','绿','黄','紫','橙'];var phase='idle',i=0,total=20,correct=0,rec=[],stimAt=0,wordC=0,inkC=0;
colors.forEach(function(c,k){var b=document.createElement('button');b.className='cbtn';b.style.background=c;b.title=names[k];b.innerHTML='<small>'+(k+1)+'</small>';b.addEventListener('click',function(){answer(k)});$('colors').appendChild(b)});
function next(){i++;var wc=Math.floor(Math.random()*6),ic=Math.floor(Math.random()*6);wordC=wc;inkC=ic;$('word').textContent=words[wc];$('word').style.color=colors[ic];$('q').textContent=i+'/20';$('fb').textContent='';stimAt=performance.now();phase='go'}
function answer(k){if(phase!=='go')return;var rt=performance.now()-stimAt,ok=k===inkC;phase='gap';if(ok)correct++;rec.push({congruent:inkC===wordC,rt:rt,ok:ok});$('ok').textContent=correct;var good=rec.filter(function(r){return r.ok});$('avg').textContent=good.length?Math.round(good.reduce(function(a,b){return a+b.rt},0)/good.length)+'ms':'—';
$('fb').textContent=ok?'✓ 正确':('✗ 墨水是'+names[inkC]);$('fb').style.color=ok?'var(--teal)':'var(--bad)';
setTimeout(function(){if(i<total)next();else finish()},ok?220:520)}
function finish(){phase='done';$('word').textContent='完成';$('word').style.color='var(--gold)';var con=rec.filter(function(r){return r.congruent&&r.ok}),inc=rec.filter(function(r){return !r.congruent&&r.ok});
var ac=con.length?con.reduce(function(a,b){return a+b.rt},0)/con.length:0,ai=inc.length?inc.reduce(function(a,b){return a+b.rt},0)/inc.length:0;var adj=(rec.filter(function(r){return r.ok}).reduce(function(a,b){return a+b.rt},0)/Math.max(1,rec.filter(function(r){return r.ok}).length))+ (total-correct)*250;
$('fb').innerHTML='正确 '+correct+'/20 · 修正均时 '+Math.round(adj)+'ms<br>斯特鲁普效应（不一致−一致）：'+Math.round(ai-ac)+'ms';$('fb').style.color='var(--teal)';$('btn').textContent='再测一次'}
function start(){i=0;correct=0;rec=[];$('ok').textContent='0';$('avg').textContent='—';$('btn').textContent='重新开始';next()}
$('btn').addEventListener('click',function(){if(phase==='idle'||phase==='done')start()});
document.addEventListener('keydown',function(e){if(e.repeat)return;var k=Number(e.key);if(k>=1&&k<=6){answer(k-1)}else if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__STROOP={start:start,answer:answer,next:next,get phase(){return phase},get wordC(){return wordC},get inkC(){return inkC},get i(){return i},get correct(){return correct}};
})();</script></body></html>
