<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>数字广度测试</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,480px);height:100%;max-height:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vmin,18px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(14px,3.4vmin,24px)}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--gold)}
.segs{display:flex;gap:8px}.seg{min-height:40px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(243,233,218,.7);cursor:pointer;font-size:clamp(12px,2vmin,14px)}
.seg.on{background:rgba(246,193,119,.2);border-color:var(--gold);color:var(--gold)}
.stage{flex:1 1 auto;width:100%;min-height:0;border-radius:16px;background:linear-gradient(160deg,#1c1730,#151126);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.digits{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:1.4em}
.digit{font-size:clamp(34px,9vmin,58px);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;opacity:.1;transition:opacity 100ms}
.digit.on{opacity:1;text-shadow:0 0 20px rgba(246,193,119,.5)}
.ask{color:var(--dim);font-size:clamp(12px,2.1vmin,15px);min-height:1.4em;text-align:center}
.input{font-size:clamp(26px,7vmin,44px);font-weight:700;color:var(--teal);letter-spacing:.15em;min-height:1.2em;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,minmax(52px,64px));gap:8px;justify-content:center}
.pad button{min-height:50px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--ink);cursor:pointer;font-size:clamp(16px,3vmin,22px)}
.pad button.del{background:rgba(255,159,159,.12);border-color:rgba(255,159,159,.35);grid-column:span 1}
.pad button.ok{background:rgba(127,216,200,.14);border-color:rgba(127,216,200,.4);grid-column:span 2;color:#d8fff5}
.bigbtn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}
</style></head><body><div id="app">
<h1>数字 <b>广度测试</b></h1>
<div class="segs" id="modes"><button class="seg on" data-v="forward">正背</button><button class="seg" data-v="backward">倒背</button></div>
<div class="stage"><div class="digits" id="digits"></div><div class="input" id="input"></div><div class="ask" id="ask">点开始，从 3 位数字起</div><div class="pad" id="pad"></div></div>
<div><button class="bigbtn" id="btn">开始</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var mode='forward',len=3,retries=0,seq=[],input='',phase='idle';
[1,2,3,4,5,6,7,8,9].forEach(function(n){var b=document.createElement('button');b.textContent=n;b.addEventListener('click',function(){type(String(n))});$('pad').appendChild(b)});
var del=document.createElement('button');del.className='del';del.textContent='⌫';del.addEventListener('click',function(){input=input.slice(0,-1);$('input').textContent=input});$('pad').appendChild(del);
var okb=document.createElement('button');okb.className='ok';okb.textContent='提交';okb.addEventListener('click',submit);$('pad').appendChild(okb);
var segs=$('modes').querySelectorAll('.seg');for(var i=0;i<segs.length;i++)segs[i].addEventListener('click',function(){for(var j=0;j<segs.length;j++)segs[j].classList.remove('on');this.classList.add('on');mode=this.getAttribute('data-v');reset()});
function gen(){seq=[];for(let i=0;i<len;i++)seq.push(Math.floor(Math.random()*10));$('digits').innerHTML='';seq.forEach(function(d){var e=document.createElement('span');e.className='digit';e.textContent=d;$('digits').appendChild(e)})}
function flash(){return new Promise(function(res){var es=$('digits').children;var toShow=mode==='forward'?seq:seq.slice().reverse();var i=0;var f=function(){for(var k=0;k<es.length;k++)es[k].classList.remove('on');if(i<toShow.length){var idx=mode==='forward'?i:(len-1-i);es[idx].classList.add('on');i++;setTimeout(f,700)}else{setTimeout(function(){for(var k=0;k<es.length;k++)es[k].classList.remove('on');res()},400)}};f()})}
function present(){phase='show';input='';$('input').textContent='';$('ask').textContent='记住这些数字…';gen();flash().then(function(){phase='input';$('ask').textContent='用数字键盘输入'+(mode==='backward'?'（倒序）':'')+'，不限时'})}
function type(d){if(phase!=='input')return;if(input.length>=len)return;input+=d;$('input').textContent=input}
function submit(){if(phase!=='input')return;var want=mode==='forward'?seq.join(''):seq.slice().reverse().join('');if(input===want){$('ask').textContent='✓ 正确！升到 '+(len+1)+' 位';len++;retries=0;phase='done';$('btn').textContent='下一位数';setTimeout(present,750)}
else{retries++;if(retries===1){$('ask').textContent='✗ 不对，同长度再来一次';phase='done';$('btn').textContent='重试';setTimeout(present,750)}else{$('ask').textContent='两次都错，成绩：'+(len-1)+' 位';phase='done';$('btn').textContent='重新开始'}}}
function start(){len=3;retries=0;$('btn').textContent='重新开始';present()}
function reset(){phase='idle';$('digits').innerHTML='';input='';$('input').textContent='';$('ask').textContent='点开始，从 3 位数字起';$('btn').textContent='开始'}
$('btn').addEventListener('click',function(){if(phase==='idle'||phase==='done'){if($('btn').textContent==='重新开始')start();else if($('btn').textContent==='重试'||$('btn').textContent==='下一位数')present();else start()}});
document.addEventListener('keydown',function(e){if(e.repeat)return;if(/^[0-9]$/.test(e.key))type(e.key);else if(e.key==='Backspace'){input=input.slice(0,-1);$('input').textContent=input}else if(e.key==='Enter')submit();else if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__DS={start:start,present:present,submit:submit,type:type,setMode:function(m){mode=m},get seq(){return seq.slice()},get len(){return len},get input(){return input},get phase(){return phase}};
reset();})();</script></body></html>
