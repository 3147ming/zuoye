<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>舒尔特表格</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,560px);height:100%;max-height:780px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,16px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(12px,3vmin,22px)}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--gold)}
.top{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.top b{color:var(--ink)}.top .t{color:var(--gold);font-size:1.3em}
.segs{display:flex;gap:6px}.seg{min-height:38px;min-width:44px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(243,233,218,.7);cursor:pointer;font-size:clamp(11px,1.9vmin,13px)}
.seg.on{background:rgba(246,193,119,.2);border-color:var(--gold);color:var(--gold)}
.gridwrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.grid{aspect-ratio:1;width:var(--side,100%);max-width:100%;max-height:100%;margin:auto;display:grid;gap:clamp(3px,0.7vmin,6px)}
.cell{border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(243,233,218,.85);font-size:clamp(11px,2.4vmin,20px);transition:background 80ms}
.cell:hover{background:rgba(246,193,119,.1)}.cell.bad{background:rgba(255,159,159,.3);color:var(--bad)}
.next{color:var(--teal);font-size:clamp(12px,2.1vmin,15px)}
.bigbtn{min-height:46px;padding:0 22px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}
</style></head><body><div id="app">
<h1>舒尔特 <b>表格</b></h1>
<div class="top"><div><span class="seg" id="sizeBtn" style="cursor:default">5×5</span> <span id="target">目标 <b>1</b></span></div><span class="t" id="clock">0.00s</span><span>错误 <b id="err">0</b></span></div>
<div class="segs" id="sizes"><button class="seg on" data-v="3">3×3</button><button class="seg" data-v="4">4×4</button><button class="seg" data-v="5">5×5</button></div>
<div class="gridwrap"><div class="grid" id="grid"></div></div>
<div class="next" id="next">点「开始」计时，按 1→N 顺序点击</div>
<div><button class="bigbtn" id="btn">开始</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var size=5,n=0,nextNum=1,errs=0,startAt=0,timer=null,running=false,cells=[];
var segs=$('sizes').querySelectorAll('.seg');for(var i=0;i<segs.length;i++)segs[i].addEventListener('click',function(){for(var j=0;j<segs.length;j++)segs[j].classList.remove('on');this.classList.add('on');size=Number(this.getAttribute('data-v'));build();reset()});
function fit(){var w=document.querySelector('.gridwrap');if(!w)return;var side=Math.min(w.clientWidth,w.clientHeight);$('grid').style.setProperty('--side',side+'px')}
window.addEventListener('resize',fit);
function build(){var g=$('grid');g.innerHTML='';g.style.gridTemplateColumns='repeat('+size+',1fr)';g.style.gridTemplateRows='repeat('+size+',1fr)';cells=[];n=size*size;
fit();
var arr=[];for(var k=1;k<=n;k++)arr.push(k);for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}
arr.forEach(function(v){var d=document.createElement('div');d.className='cell';d.textContent=v;d.addEventListener('click',function(){pick(v,d)});g.appendChild(d);cells.push(d)})}
function tick(){if(!running)return;$('clock').textContent=((performance.now()-startAt)/1000).toFixed(2)+'s';timer=requestAnimationFrame(tick)}
function start(){reset();build();running=true;startAt=performance.now();$('btn').textContent='重新开始';$('next').textContent='从 1 开始，按顺序点';timer=requestAnimationFrame(tick)}
function reset(){running=false;if(timer)cancelAnimationFrame(timer);nextNum=1;errs=0;$('clock').textContent='0.00s';$('err').textContent='0';$('target').innerHTML='目标 <b>1</b>';$('next').textContent='点「开始」计时，按 1→N 顺序点击';$('sizeBtn').textContent=size+'×'+size}
function pick(v,d){if(!running)return;if(v===nextNum){nextNum++;if(nextNum>n){finish();return}$('target').innerHTML='目标 <b>'+nextNum+'</b>';$('next').textContent='很好！继续找 '+nextNum}else{errs++;$('err').textContent=errs;d.classList.add('bad');setTimeout(function(){d.classList.remove('bad')},260)}}
function finish(){running=false;if(timer)cancelAnimationFrame(timer);var t=(performance.now()-startAt)/1000,pen=errs*2;$('clock').textContent=t.toFixed(2)+'s';$('next').textContent='完成！用时 '+t.toFixed(2)+'s + 罚时 '+pen+'s = '+(t+pen).toFixed(2)+'s';$('btn').textContent='再玩一次'}
$('btn').addEventListener('click',start);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__SCHULTE={start:start,reset:reset,pick:pick,build:build,setSize:function(s){size=s;segs.forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===String(s))});build();reset()},get nextNum(){return nextNum},get n(){return n},get errs(){return errs},get running(){return running}};
build();reset();})();</script></body></html>
