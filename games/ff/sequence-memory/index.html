<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>序列记忆测试</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--teal:#7fd8c8;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:min(100%,520px);height:100%;max-height:780px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.6vmin,18px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(14px,3.4vmin,24px);justify-content:center}
h1{margin:0;font-size:clamp(16px,3.2vmin,22px);letter-spacing:.06em}h1 b{color:var(--gold)}
.top{display:flex;gap:clamp(14px,4vmin,30px);color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.top b{color:var(--ink)}.top .lvl b{color:var(--gold)}
.segs{display:flex;gap:8px}.seg{min-height:40px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(243,233,218,.7);cursor:pointer;font-size:clamp(12px,2vmin,14px)}
.seg.on{background:rgba(246,193,119,.2);border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.4vmin,10px);width:var(--side,min(62vmin,340px));height:var(--side,min(62vmin,340px));margin:auto}
.cell{border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background 80ms,box-shadow 80ms}
.cell.on{background:var(--gold);box-shadow:0 0 22px rgba(246,193,119,.55)}.cell.bad{background:rgba(255,159,159,.4)}
.msg{color:var(--teal);font-size:clamp(12px,2.1vmin,15px);min-height:1.4em;text-align:center}
.bigbtn{min-height:44px;padding:0 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;font-size:clamp(13px,2.2vmin,16px);font-weight:600;background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}
</style></head><body><div id="app">
<h1>序列 <b>记忆测试</b></h1>
<div class="top"><span class="lvl">长度 <b id="lvl">3</b></span><span>最佳 <b id="best">—</b></span></div>
<div class="segs" id="modes"><button class="seg on" data-v="forward">正序</button><button class="seg" data-v="backward">倒序</button></div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg">记住方块闪烁顺序，再按顺序点出来</div>
<div><button class="bigbtn" id="btn">开始（从 3 步）</button></div>
</div>
<script>
function fitSide(el){var app=document.getElementById('app')||el.parentNode;
  var cs=getComputedStyle(app);
  var padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  var padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  var gap=parseFloat(cs.rowGap)||0;
  var kids=app.children,otherH=0,count=0;
  for(var i=0;i<kids.length;i++){if(kids[i]!==el&&kids[i].offsetParent!==null){otherH+=kids[i].offsetHeight;count++}}
  var availH=app.clientHeight-padY-otherH-gap*count;
  var availW=app.clientWidth-padX;
  var av=Math.min(availW,availH);
  if(av>0)el.style.setProperty('--side',av+'px');else el.style.removeProperty('--side')}
(function(){
'use strict';var $=function(i){return document.getElementById(i)};var grid=$('grid'),cells=[],mode='forward',len=3,seq=[],player=[],phase='idle';
for(let i=0;i<9;i++){var d=document.createElement('div');d.className='cell';(function(k){d.addEventListener('click',function(){pick(k)})})(i);grid.appendChild(d);cells.push(d)}
var best=(function(){try{return Number(localStorage.getItem('ff_seq_best_'+mode)||0)}catch(e){return 0}})();
function showBest(){$('best').textContent=best?best+' 步':'—'}showBest();
var segs=$('modes').querySelectorAll('.seg');for(var i=0;i<segs.length;i++)segs[i].addEventListener('click',function(){for(var j=0;j<segs.length;j++)segs[j].classList.remove('on');this.classList.add('on');mode=this.getAttribute('data-v');best=(function(){try{return Number(localStorage.getItem('ff_seq_best_'+mode)||0)}catch(e){return 0}})();showBest();reset()});
function gen(){seq=[];for(let i=0;i<len;i++){var k;do{k=Math.floor(Math.random()*9)}while(seq.length&&seq[seq.length-1]===k);seq.push(k)}}
function play(){return new Promise(function(res){var order=mode==='forward'?seq:seq.slice().reverse();var i=0;var f=function(){cells.forEach(function(c){c.classList.remove('on')});if(i<order.length){cells[order[i]].classList.add('on');i++;setTimeout(f,520)}else{setTimeout(function(){cells.forEach(function(c){c.classList.remove('on')});res()},300)}};f()})}
function present(){phase='show';player=[];$('msg').textContent='看好顺序…';gen();$('lvl').textContent=len;play().then(function(){phase='input';$('msg').textContent='轮到你了：按'+(mode==='forward'?'正':'倒')+'序点 '})}
function pick(k){if(phase!=='input')return;var want=(mode==='forward'?seq:seq.slice().reverse())[player.length];if(k===want){cells[k].classList.add('on');setTimeout(function(){cells[k].classList.remove('on')},180);player.push(k);if(player.length===seq.length){if(len>best){best=len;try{localStorage.setItem('ff_seq_best_'+mode,String(best))}catch(e){}showBest()}len++;phase='done';$('msg').textContent='✓ 正确！下一步 ';$('btn').textContent='下一轮';setTimeout(present,800)}}else{cells[k].classList.add('bad');setTimeout(function(){cells[k].classList.remove('bad')},300);phase='done';$('msg').textContent='✗ 点错了。最长完成 '+(len-1)+' 步';$('btn').textContent='重新开始'}}
function start(){len=3;$('btn').textContent='重新开始';present()}
function reset(){phase='idle';cells.forEach(function(c){c.classList.remove('on','bad')});$('msg').textContent='记住方块闪烁顺序，再按顺序点出来';$('lvl').textContent='3';$('btn').textContent='开始（从 3 步）'}
$('btn').addEventListener('click',function(){var t=$('btn').textContent;if(t.indexOf('下一轮')>=0)present();else start()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
window.__SEQ={start:start,present:present,pick:pick,setMode:function(m){mode=m},get seq(){return seq.slice()},get len(){return len},get phase(){return phase}};
reset();})();window.addEventListener('resize',function(){fitSide(document.getElementById('grid'))});try{fitSide(document.getElementById('grid'))}catch(_){}
</script></body></html>
