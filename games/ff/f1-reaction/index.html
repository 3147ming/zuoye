<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>F1 反应测试</title>
<style>
:root{--sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;--gold:#f6c177;--ink:#f3e9da;--dim:rgba(243,233,218,.55);--red:#ff4d4d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0914;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{width:min(100%,520px);height:100%;max-height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vmin,26px);border:1px solid rgba(246,193,119,.18);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(246,193,119,.08),transparent 55%),#100d1c;padding:clamp(16px,4vmin,32px);text-align:center}
h1{margin:0;font-size:clamp(17px,3.4vmin,24px);letter-spacing:.1em;font-weight:600}h1 b{color:var(--gold)}
.tip{color:var(--dim);font-size:clamp(12px,2.1vmin,15px);line-height:1.7;min-height:2.6em}
.lights{display:flex;gap:clamp(10px,2.4vmin,18px);width:100%;justify-content:center}
.lamp{width:clamp(38px,11vmin,64px);height:clamp(38px,11vmin,64px);border-radius:50%;background:#241a24;border:2px solid rgba(255,255,255,.08);transition:background 80ms,box-shadow 80ms}
.lamp.on{background:var(--red);box-shadow:0 0 26px rgba(255,77,77,.75)}
.lamp.go{background:#4fe08a;box-shadow:0 0 26px rgba(79,224,138,.8)}
.time{font-size:clamp(40px,11vmin,80px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);min-height:1.2em}
.time.false{color:var(--red)}
.avg{color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bigbtn{min-height:50px;padding:0 26px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-size:clamp(14px,2.4vmin,17px);font-weight:600}
.bigbtn.primary{background:linear-gradient(160deg,#ffd89a,#f0a94f);color:#2a1a06}.bigbtn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:rgba(243,233,218,.8)}
.streak{color:var(--dim);font-size:clamp(11px,2vmin,14px);font-variant-numeric:tabular-nums}
</style></head><body><div id="app">
<h1>F1 <b>反应测试</b></h1>
<div class="tip" id="tip">点「开始」或按空格。五盏红灯依次亮起，熄灭瞬间立刻反应。</div>
<div class="lights" id="lights"></div>
<div class="time" id="time">—</div>
<div class="avg" id="avg">最近 5 次平均：—　·　个人最佳：—</div>
<div class="streak" id="streak">连续有效起步：0</div>
<div class="acts"><button class="bigbtn primary" id="start">开始 / 再来</button></div>
</div>
<script>(function(){
'use strict';var $=function(i){return document.getElementById(i)};var lamps=[],timers=[],phase='idle',results=[],streak=0,seqTimer=null,fireAt=0;
for(var i=0;i<5;i++){var d=document.createElement('div');d.className='lamp';$('lights').appendChild(d);lamps.push(d)}
function later(f,ms){var id=setTimeout(f,ms);timers.push(id);return id}function clearAll(){timers.forEach(clearTimeout);timers=[];lamps.forEach(function(l){l.className='lamp'})}
function fmt(ms){return (ms/1000).toFixed(3)+'s'}
function stats(){var r=results.slice(-5);if(r.length)$('avg').textContent='最近 5 次平均：'+fmt(r.reduce(function(a,b){return a+b},0)/r.length)+'　·　个人最佳：'+fmt(Math.min.apply(null,results));$('streak').textContent='连续有效起步：'+streak}
function start(){clearAll();phase='seq';results=[];streak=0;$('time').textContent='—';$('time').className='time';stats();$('tip').textContent='五盏灯依次亮起…别抢跑。';lamps.forEach(function(l){l.className='lamp'});
for(var i=0;i<5;i++)(function(k){later(function(){lamps[k].className='lamp on'},(k+1)*850)})(i);
later(function(){var wait=200+Math.random()*2800;seqTimer=wait;phase='wait';$('tip').textContent='灯全亮，等它熄灭…';later(go,wait)},5*850+120);
}
function go(){phase='go';fireAt=performance.now();lamps.forEach(function(l){l.className='lamp go'});$('tip').textContent='现在！'}
function react(){if(phase==='seq'||phase==='wait'){falseStart();return}if(phase!=='go')return;var rt=performance.now()-fireAt;phase='idle';lamps.forEach(function(l){l.className='lamp'});
if(rt<100){falseStart();return}results.push(rt);streak++;var last5=results.slice(-5);var best=last5.length===5&&(last5.reduce(function(a,b){return a+b},0)/5)<400;$('time').textContent=fmt(rt);$('time').className='time'+(best?'':' false');$('tip').textContent=best?'漂亮的起步！F1 车手通常 0.2–0.3 秒。':'有效起步。连续稳定才算快。';stats()}
function falseStart(){clearAll();phase='idle';streak=0;lamps.forEach(function(l){l.className='lamp'});$('time').textContent='抢跑';$('time').className='time false';$('tip').textContent='抢跑！这次不计成绩，重新计数。';stats()}
$('start').addEventListener('click',start);
document.addEventListener('keydown',function(e){if(e.repeat)return;if(e.code==='Space'){e.preventDefault();if(phase==='idle')start();else react()}else if(e.key==='Escape'){try{parent.postMessage({type:'exit'},'*')}catch(_){}}});
$('app').addEventListener('click',function(e){if(e.target.closest('.bigbtn')||e.target.closest('button'))return;if(phase==='idle')start();else react()});
window.__F1={start:start,react:react,go:go,get phase(){return phase},get results(){return results.slice()},get streak(){return streak},get fireAt(){return fireAt}};
stats();})();</script></body></html>
