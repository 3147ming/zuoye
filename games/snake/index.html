<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇</title>
<link rel="icon" href="data:,">
<style>
  :root { --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d121c; color: #dfe8f0;
    font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2vmin; overflow: hidden; user-select: none; -webkit-user-select: none;
    padding: 1.6vmin;
  }
  h1 { margin: 0; font-size: clamp(18px, 3vmin, 28px); font-weight: 700; letter-spacing: .16em; color: #8ff0b5; }
  .bar { display: flex; align-items: center; gap: 1vmin; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; align-items: center; gap: .5vmin; background: rgba(255,255,255,.07); padding: .45vmin .9vmin; border-radius: 10px; }
  .grp label { font-size: clamp(10px, 1.5vmin, 13px); opacity: .65; }
  .val { font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(13px, 2vmin, 18px); }
  button {
    font-family: var(--sans); font-size: clamp(11px, 1.7vmin, 14px);
    background: rgba(255,255,255,.12); color: #dfe8f0;
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: .4vmin .9vmin; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.2); }
  #cv { display: block; border-radius: 10px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.9); max-width: 96vw; max-height: 66vh; }
  #msg {
    position: fixed; inset: 0; display: none; flex-direction: column; gap: 1.4vmin;
    align-items: center; justify-content: center; background: rgba(13,18,28,.8); backdrop-filter: blur(3px);
  }
  #msg .m-title { font-size: clamp(20px, 4vmin, 38px); font-weight: 800; color: #ff8fb1; }
  #touch { display: none; gap: .6vmin; }
  #touch button {
    min-width: 48px; min-height: 42px; border-radius: 12px; font-size: 16px; font-weight: 700;
    background: rgba(255,255,255,.1); color: #dfe8f0; touch-action: none;
  }
  #touch button:active { background: #8ff0b5; color: #0d121c; }
  .hint { font-size: clamp(10px, 1.5vmin, 13px); opacity: .5; text-align: center; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>

<div class="bar">
  <div class="grp"><label>得分</label><span class="val" id="score">0</span></div>
  <div class="grp"><label>最高</label><span class="val" id="best">0</span></div>
  <div class="grp"><label>状态</label><span class="val" id="state">准备</span></div>
  <div class="grp">
    <button id="btn-wrap">穿墙：关</button>
    <button id="btn-new">重开</button>
  </div>
</div>

<canvas id="cv"></canvas>

<div id="touch">
  <button id="b-left">◀</button>
  <button id="b-up">▲</button>
  <button id="b-down">▼</button>
  <button id="b-right">▶</button>
  <button id="b-pause">⏸</button>
</div>

<div class="hint">方向键 / WASD 操控 · 空格 暂停 · R 重开 · 吃一个果实 +10 分并长两节</div>

<div id="msg">
  <div class="m-title"></div>
  <button>再来一局</button>
</div>

<script src="js/snake.js"></script>
</body>
</html>
