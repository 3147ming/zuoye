<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>算术挑战</title>
<style>
  :root { --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0914; color: #f3e9da; font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vmin; padding: 2vmin; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  h1 { margin: 0; font-size: clamp(20px, 3.4vmin, 34px); font-weight: 600; letter-spacing: .12em; }
  .hud { display: flex; gap: clamp(14px, 3vmin, 34px); font-size: clamp(12px, 1.8vmin, 16px);
         color: rgba(243,233,218,.72); letter-spacing: .06em; }
  .hud b { color: #f6c177; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clock.low b { color: #ff9f9f; }
  #q {
    font-size: clamp(34px, 8vmin, 80px); font-weight: 700; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; min-height: 1.3em;
    transition: background 120ms;
    padding: 0 .4em; border-radius: .2em;
  }
  #q.good { background: rgba(79,208,138,.18); }
  #q.bad { animation: shake 300ms; background: rgba(255,159,159,.18); }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); }
    40% { transform: translateX(8px); } 60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
  }
  .answer { display: flex; gap: 10px; align-items: center; }
  #ans {
    font: inherit; font-size: clamp(20px, 3.6vmin, 34px); width: 7em; text-align: center;
    color: #f3e9da; background: rgba(255,255,255,.04);
    border: 1px solid rgba(246,193,119,.5); border-radius: 12px; padding: .35em .5em;
    font-variant-numeric: tabular-nums;
  }
  #ans:focus { outline: none; border-color: #f6c177; }
  button.key, .submit {
    font: inherit; font-size: clamp(15px, 2.4vmin, 22px);
    color: #ffe3bd; background: rgba(246,193,119,.12);
    border: 1px solid rgba(246,193,119,.4); border-radius: 12px;
    padding: .5em .9em; cursor: pointer; min-width: 2.2em;
  }
  button.key:active, .submit:active { background: rgba(246,193,119,.34); }
  #pad { display: grid; grid-template-columns: repeat(4, minmax(48px, 9vmin)); gap: 8px; }
  #pad .del { background: rgba(255,159,159,.12); border-color: rgba(255,159,159,.4); }
  #pad .ent { grid-column: span 2; background: rgba(127,216,200,.14); border-color: rgba(127,216,200,.5); color: #d8fff5; }
  #combo { font-size: clamp(14px, 2.2vmin, 20px); color: #7fd8c8; letter-spacing: .1em; min-height: 1.3em; }
  #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(5,4,12,.75); backdrop-filter: blur(3px); }
  #over.on { display: flex; }
  .panel { background: #17132a; border: 1px solid rgba(246,193,119,.4); border-radius: 20px;
           padding: 4vmin 6vmin; display: flex; flex-direction: column; align-items: center; gap: 1.6vmin; }
  .panel h2 { margin: 0; font-size: clamp(18px, 3vmin, 28px); letter-spacing: .14em; }
  .panel .line { font-size: clamp(13px, 2vmin, 17px); color: rgba(243,233,218,.8); }
  .panel .line b { color: #f6c177; }
  .bigbtn { font: inherit; font-size: clamp(16px, 2.6vmin, 24px); letter-spacing: .12em;
            color: #ffe3bd; background: rgba(246,193,119,.16);
            border: 1px solid rgba(246,193,119,.6); border-radius: 999px;
            padding: .7em 2.4em; cursor: pointer; }
  .bigbtn:hover { background: rgba(246,193,119,.28); }
  #newrec { color: #7fd8c8; letter-spacing: .08em; min-height: 1.3em; font-size: clamp(13px, 2vmin, 17px); }
</style>
</head>
<body>
  <h1>算术挑战</h1>
  <div class="hud">
    <span id="clock">剩余 <b id="left">60</b> 秒</span>
    <span>得分 <b id="score">0</b></span>
    <span>答对 <b id="right">0</b> / <b id="asked">0</b></span>
    <span>最高分 <b id="best">—</b></span>
  </div>
  <div id="q">12 + 7 = ?</div>
  <div id="combo"></div>
  <div class="answer">
    <input id="ans" type="text" inputmode="numeric" autocomplete="off" aria-label="答案输入">
  </div>
  <div id="pad"></div>

  <div id="over">
    <div class="panel" id="startPanel">
      <h2>60 秒限时口算</h2>
      <div class="line">连对越多难度越高，得分也越高；答错降一档。</div>
      <button class="bigbtn" id="startBtn" type="button">开始游戏</button>
    </div>
    <div class="panel" id="endPanel" style="display:none;">
      <h2>时间到!</h2>
      <div class="line">得分 <b id="fscore">0</b> · 答对 <b id="fright">0</b> / <b id="fasked">0</b></div>
      <div id="newrec"></div>
      <button class="bigbtn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var qEl = document.getElementById('q');
  var ansEl = document.getElementById('ans');
  var leftEl = document.getElementById('left');
  var clockEl = document.getElementById('clock');
  var scoreEl = document.getElementById('score');
  var rightEl = document.getElementById('right');
  var askedEl = document.getElementById('asked');
  var bestEl = document.getElementById('best');
  var comboEl = document.getElementById('combo');
  var overEl = document.getElementById('over');
  var startPanel = document.getElementById('startPanel');
  var endPanel = document.getElementById('endPanel');
  var pad = document.getElementById('pad');
  var DURATION = 60;

  var tier = 1, score = 0, right = 0, asked = 0, streak = 0;
  var left = DURATION, tick = 0, playing = false, cur = null;
  var used = {};

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function gen() {
    for (var guard = 0; guard < 60; guard++) {
      var t = tier;
      var op = ['+', '-', '×', '÷'][rnd(0, 3)];
      var a, b, ans;
      if (op === '+') {
        a = t <= 1 ? rnd(1, 9) : t === 2 ? rnd(10, 40) : rnd(10, 99);
        b = t <= 1 ? rnd(1, 9) : t === 2 ? rnd(5, 40) : rnd(10, 99);
        ans = a + b;
      } else if (op === '-') {
        a = t <= 1 ? rnd(2, 9) : t === 2 ? rnd(15, 50) : rnd(30, 99);
        b = t <= 1 ? rnd(1, a - 1) : rnd(5, a - 1);
        ans = a - b;
      } else if (op === '×') {
        a = t <= 1 ? rnd(2, 5) : t === 2 ? rnd(3, 9) : rnd(6, 15);
        b = t <= 1 ? rnd(2, 5) : t === 2 ? rnd(2, 9) : rnd(3, 9);
        ans = a * b;
      } else {
        b = t <= 1 ? rnd(2, 5) : rnd(2, 9);
        ans = t <= 1 ? rnd(2, 6) : t === 2 ? rnd(3, 12) : rnd(4, 18);
        a = b * ans;
      }
      var key = op + ':' + a + ':' + b;
      if (!used[key]) {
        used[key] = 1;
        if (Object.keys(used).length > 200) used = {};
        return { text: a + ' ' + op + ' ' + b + ' = ?', ans: ans };
      }
    }
    return { text: '3 + 4 = ?', ans: 7 };
  }

  function next() {
    cur = gen();
    qEl.textContent = cur.text;
    ansEl.value = '';
  }

  function setTier() {
    tier = Math.min(3, 1 + Math.floor(streak / 5));
  }

  function submit() {
    if (!playing) return;
    var raw = ansEl.value.trim();
    if (raw === '' || raw === '-') return;
    var v = parseInt(raw, 10);
    if (isNaN(v)) return;
    asked++;
    askedEl.textContent = String(asked);
    if (v === cur.ans) {
      streak++;
      right++;
      setTier();
      var mult = streak >= 10 ? 3 : streak >= 5 ? 2 : 1;
      score += 10 * tier * mult;
      scoreEl.textContent = String(score);
      rightEl.textContent = String(right);
      comboEl.textContent = streak >= 5 ? '连击 ×' + mult + ' · 连对 ' + streak : (streak >= 2 ? '连对 ' + streak : '');
      qEl.classList.add('good');
      setTimeout(function () { qEl.classList.remove('good'); }, 200);
      next();
    } else {
      streak = 0;
      tier = Math.max(1, tier - 1);
      comboEl.textContent = '';
      qEl.classList.add('bad');
      qEl.textContent = cur.text + ' ' + cur.ans;
      setTimeout(function () { qEl.classList.remove('bad'); next(); }, 900);
    }
  }

  ansEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });

  // 触屏小键盘
  var keys = ['7','8','9','del','4','5','6','0','1','2','3','ent'];
  var padHtml = '';
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (k === 'del') padHtml += '<button type="button" class="key del" data-k="del">⌫</button>';
    else if (k === 'ent') padHtml += '<button type="button" class="key ent" data-k="ent">提交</button>';
    else padHtml += '<button type="button" class="key" data-k="' + k + '">' + k + '</button>';
  }
  pad.innerHTML = padHtml;
  pad.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('button.key');
    if (!b || !playing) return;
    var k = b.getAttribute('data-k');
    if (k === 'del') ansEl.value = ansEl.value.slice(0, -1);
    else if (k === 'ent') submit();
    else { ansEl.value += k; if (ansEl.value.length > 6) ansEl.value = ansEl.value.slice(0, 6); }
    e.preventDefault();
  });

  function loadBest() { try { return Number(localStorage.getItem('worldhub.mathdash.best')) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('worldhub.mathdash.best', String(v)); } catch (e) {} }

  function start() {
    playing = true;
    tier = 1; streak = 0; score = 0; right = 0; asked = 0; left = DURATION; used = {};
    scoreEl.textContent = '0'; rightEl.textContent = '0'; askedEl.textContent = '0';
    leftEl.textContent = String(left);
    comboEl.textContent = '';
    clockEl.classList.remove('low');
    overEl.classList.remove('on');
    next();
    clearInterval(tick);
    tick = setInterval(function () {
      left--;
      leftEl.textContent = String(left);
      if (left <= 10) clockEl.classList.add('low');
      if (left <= 0) finish();
    }, 1000);
  }

  function finish() {
    playing = false;
    clearInterval(tick);
    startPanel.style.display = 'none';
    endPanel.style.display = 'flex';
    document.getElementById('fscore').textContent = String(score);
    document.getElementById('fright').textContent = String(right);
    document.getElementById('fasked').textContent = String(asked);
    var prev = loadBest();
    if (score > prev) {
      saveBest(score);
      document.getElementById('newrec').textContent = '🎉 新纪录!';
      bestEl.textContent = String(score);
    } else {
      document.getElementById('newrec').textContent = '最高分 ' + prev;
    }
    overEl.classList.add('on');
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
  bestEl.textContent = String(loadBest());

  overEl.classList.add('on');
  qEl.textContent = '准备中…';
})();
</script>
</body>
</html>
