<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扫雷</title>
<link rel="icon" href="data:,">
<style>
  :root { --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #17141f; color: #e8e2f0;
    font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4vmin; overflow: hidden; user-select: none; -webkit-user-select: none;
    padding: 2vmin;
  }
  h1 { margin: 0; font-size: clamp(19px, 3.4vmin, 32px); font-weight: 700; letter-spacing: .16em; color: #c8b6ff; }

  .bar { display: flex; align-items: center; gap: 1.4vmin; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; align-items: center; gap: .5vmin; background: rgba(255,255,255,.07); padding: .45vmin .9vmin; border-radius: 10px; }
  .grp label { font-size: clamp(10px, 1.5vmin, 13px); opacity: .7; }
  select, button {
    font-family: var(--sans); font-size: clamp(11px, 1.7vmin, 14px);
    background: rgba(255,255,255,.12); color: #e8e2f0;
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: .35vmin .8vmin; cursor: pointer;
  }
  button:hover, select:hover { background: rgba(255,255,255,.2); }
  .stat { font-variant-numeric: tabular-nums; font-weight: 700; font-size: clamp(13px, 2vmin, 18px); min-width: 3.2em; text-align: center; }
  .stat.mine { color: #ff8fb1; }
  .stat.time { color: #8ff0b5; }
  .face { font-size: clamp(18px, 3vmin, 28px); background: none; border: 0; padding: 0 .3vmin; }

  #board {
    display: grid; gap: 1px; background: rgba(255,255,255,.1);
    padding: 3px; border-radius: 8px; touch-action: manipulation;
  }
  .c {
    width: clamp(15px, 2.7vmin, 27px); height: clamp(15px, 2.7vmin, 27px);
    background: #4a4360; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(10px, 1.9vmin, 18px);
    cursor: pointer; user-select: none; transition: background .08s;
  }
  .c:hover { background: #5b5375; }
  .c.open { background: #262234; cursor: default; }
  .c.open:hover { background: #262234; }
  .c.mine { background: #b8475f; }
  .c.boom { background: #ff4d4d; }
  .c.flag { background: #4a4360; }
  .c.n1 { color: #7ec8ff; } .c.n2 { color: #8ff0b5; } .c.n3 { color: #ff9f9f; }
  .c.n4 { color: #c0a5ff; } .c.n5 { color: #ffd166; } .c.n6 { color: #6ee7d7; }
  .c.n7 { color: #f9a8d4; } .c.n8 { color: #d4d4d8; }

  .foot { font-size: clamp(10px, 1.5vmin, 13px); opacity: .6; text-align: center; line-height: 1.7; }
  .foot b { color: #c8b6ff; font-weight: 600; }
  .best { font-size: clamp(10px, 1.5vmin, 13px); opacity: .8; color: #ffd166; }
</style>
</head>
<body>
<h1>扫雷</h1>

<div class="bar">
  <div class="grp">
    <label>难度</label>
    <select id="lv">
      <option value="beginner">初级 9×9 / 10 雷</option>
      <option value="intermediate">中级 16×16 / 40 雷</option>
      <option value="expert">高级 30×16 / 99 雷</option>
      <option value="custom">自定义</option>
    </select>
  </div>
  <div class="grp">
    <button class="face" id="face" title="重新开始">🙂</button>
    <span class="stat mine" id="mines">10</span>
    <span class="stat time" id="time">0</span>
  </div>
</div>

<div id="board"></div>

<div class="best" id="best"></div>
<div class="foot">
  左键挖开 · 右键插旗 · 手机长按插旗<br>
  <b>踩到雷</b> 输，<b>把所有安全格挖完</b> 赢
</div>

<script src="js/mine.js"></script>
</body>
</html>
