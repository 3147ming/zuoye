<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界大厅 World Hub</title>
<meta name="description" content="基于 Web 的 2D 横版世界大厅游戏合集">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="frame">
    <div class="stage" id="stage">
      <!-- 逻辑分辨率固定 1280×720，实际像素由 SceneManager 按 DPR 设定 -->
      <canvas id="game" width="1280" height="720"></canvas>

      <!-- HUD：文本走 DOM，保证任意缩放下都是清晰的 -->
      <div class="hud">
        <div class="hud-title">
          <h1>世界大厅 <span>World Hub</span></h1>
          <p>横版世界 · 五道传送门 · 五个世界</p>
        </div>

        <div class="hud-keys">
          <span><kbd>A</kbd><kbd>D</kbd> 移动</span>
          <span class="sep"></span>
          <span><kbd>空格</kbd> 跳跃</span>
          <span class="sep"></span>
          <span><kbd>H</kbd> 帮助</span>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>

      <!-- 对话面板：守灯人说话时才显示（E 逐句推进 / Esc 关闭） -->
      <div class="dialogue" id="dialogue" role="dialog" aria-live="polite">
        <span class="dialogue-name" id="dialogueName">守灯人</span>
        <p class="dialogue-text" id="dialogueText"></p>
        <div class="dialogue-foot">
          <span class="dialogue-step" id="dialogueStep"></span>
          <span class="dialogue-hint">E 继续 · Esc 关闭</span>
        </div>
      </div>
    </div>

    <p class="caption">WorldHub · Canvas 1280 × 720 · 原生 HTML / CSS / JavaScript</p>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/sceneManager.js"></script>
  <script src="js/player.js"></script>
  <script src="js/npc.js"></script>
  <script src="js/save.js"></script>
  <script src="js/world.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/fireice.js"></script>
  <script src="js/games/fight.js"></script>
  <script src="js/games/cards.js"></script>
  <script src="js/games/memory.js"></script>
  <script>
  (function () {
    'use strict';

    /* ---------- HUD：底部提示条 ---------- */
    var toastEl = document.getElementById('toast');
    var current = '';

    window.HUD = {
      toast: function (text) {
        if (text === current) return;
        current = text;
        if (!text) {
          toastEl.classList.remove('on');
          return;
        }
        toastEl.textContent = text;
        toastEl.classList.add('on');
      }
    };

    /* ---------- 注册场景 ---------- */
    SceneManager.register('world', function () {
      return new WorldScene();
    });

    /* ---------- 启动 ---------- */
    SceneManager.start(document.getElementById('game'));
    SceneManager.change('world');

    // 供手动调试：SceneManager.change('world')
    window.WorldHub = { SceneManager: SceneManager };
  })();
  </script>
</body>
</html>
