<html lang="zh-CN">

<title>网址推荐</title>
<style>
  :root { --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0914; color: #f3e9da; font-family: var(--sans); }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .wrap { flex: 1; display: flex; flex-direction: column; width: min(960px, 100%); margin: 0 auto; padding: 2.2cqw 2.2cqw 3cqw; gap: 1.4cqw; overflow: hidden; container-type: inline-size; }

  .head { display: flex; align-items: center; gap: 1cqw; }
  .head h1 { font-size: 3.6cqw; margin: 0; font-weight: 600; letter-spacing: 0.06em; }
  .mode { font-size: 2cqw; padding: 0.5cqw 1.4cqw; border-radius: 999px; border: 1px solid transparent; letter-spacing: 0.1em; }
  .mode.on { color: #7fd8c8; border-color: rgba(127,216,200,0.45); background: rgba(127,216,200,0.08); }
  .mode.off { color: #f6c177; border-color: rgba(246,193,119,0.45); background: rgba(246,193,119,0.08); }

  .form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1cqw; }
  .form input { font: inherit; font-size: 2.4cqw; padding: 1.2cqw 1.6cqw; border-radius: 10px;
    border: 1px solid rgba(255,220,180,0.2); background: rgba(255,255,255,0.04); color: #f3e9da; }
  .form input:focus { outline: none; border-color: rgba(246,193,119,0.7); }
  .form button { font: inherit; font-size: 2.4cqw; padding: 1.2cqw 2.4cqw; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(246,193,119,0.5); background: rgba(246,193,119,0.14); color: #ffe3bd; }
  .form button:hover { background: rgba(246,193,119,0.24); }

  .search { width: 100%; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 2.4cqw; padding: 1.1cqw 1.8cqw; border-radius: 999px;
    border: 1px solid rgba(127,216,200,0.35); background: rgba(127,216,200,0.06); color: #f3e9da;
    -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: rgba(243,233,218,0.4); }
  .search input:focus { outline: none; border-color: rgba(127,216,200,0.8); background: rgba(127,216,200,0.12); }

  .err { min-height: 2.4cqw; font-size: 2.2cqw; color: #ff9f9f; letter-spacing: 0.04em; }

  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1cqw; padding-right: 0.4cqw; align-content: start; }

  /* ---- 分页：分类标签 + 翻页条 + 卡片网格 ---- */
  .tabs { display: flex; flex-wrap: wrap; gap: 0.8cqw; }
  .tab { font: inherit; font-size: 2cqw; padding: 0.7cqw 1.4cqw; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,220,180,0.18); background: rgba(255,255,255,0.03); color: rgba(243,233,218,0.7);
    white-space: nowrap; }
  .tab:hover { border-color: rgba(246,193,119,0.5); color: #ffe3bd; }
  .tab.active { border-color: rgba(246,193,119,0.7); background: rgba(246,193,119,0.16); color: #ffe3bd; font-weight: 600; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 2cqw; }
  .pager button { font: inherit; font-size: 2.4cqw; padding: 0.7cqw 2.4cqw; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(246,193,119,0.5); background: rgba(246,193,119,0.14); color: #ffe3bd; }
  .pager button:hover:not(:disabled) { background: rgba(246,193,119,0.26); }
  .pager button:disabled { opacity: 0.35; cursor: not-allowed; }
  .pager .pinfo { font-size: 2.2cqw; color: rgba(243,233,218,0.7); letter-spacing: 0.05em; min-width: 20cqw; text-align: center; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1cqw; align-content: start; width: 100%; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 2.4cqw; color: rgba(243,233,218,0.4); padding: 6cqw 0; }

  /* 搜索结果视图 */
  .result-head { font-size: 2.2cqw; color: rgba(243,233,218,0.6); letter-spacing: 0.04em; padding: 0.4cqw 0.4cqw 0.2cqw; }
  .result-head b { color: #7fd8c8; font-weight: 600; }
  .rgroup { margin-bottom: 1.6cqw; }
  .rgroup-h { font-size: 2.4cqw; font-weight: 600; color: #ffe3bd; letter-spacing: 0.03em; padding: 0.6cqw 0.4cqw; border-left: 0.5cqw solid rgba(246,193,119,0.6); }

  .card { display: flex; flex-direction: column; gap: 0.5cqw; padding: 1.4cqw 1.6cqw; border-radius: 12px; min-width: 0;
    border: 1px solid rgba(255,220,180,0.12); background: rgba(255,255,255,0.035); }
  .card .lc-row { display: flex; align-items: center; gap: 1.2cqw; }
  .card .lc-name { font-size: 2.7cqw; font-weight: 600; color: #ffe3bd; text-decoration: none; flex-shrink: 0;
    max-width: 56%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .lc-name:hover { text-decoration: underline; }
  .card .lc-url { flex: 1; min-width: 0; font-size: 2cqw; color: rgba(243,233,218,0.5);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .lc-desc { font-size: 2.1cqw; color: rgba(243,233,218,0.62); line-height: 1.45; }
  .card .lc-pending { flex-shrink: 0; font-size: 1.8cqw; color: #f6c177; border: 1px solid rgba(246,193,119,0.4);
    padding: 0.3cqw 1cqw; border-radius: 6px; }
  .card .lc-del { flex-shrink: 0; font: inherit; font-size: 2cqw; cursor: pointer; padding: 0.5cqw 1.3cqw;
    border-radius: 8px; border: 1px solid rgba(255,140,140,0.4); background: transparent; color: #ffb0b0; }
  .card .lc-del:hover { background: rgba(255,140,140,0.14); }

  .foot { font-size: 2cqw; color: rgba(243,233,218,0.42); text-align: center; letter-spacing: 0.04em; }

  /* ---- 响应式断点：手机单列 / 平板双列 / 桌面三列 ---- */
  @media (max-width: 500px) {
    .wrap { width: 100%; }
    .form { grid-template-columns: 1fr; }
    .head h1 { font-size: 5cqw; }
    .form input, .form button { font-size: 4cqw; padding: 1.6cqw 1.8cqw; }
    .search input { font-size: 4cqw; padding: 1.6cqw 1.8cqw; }
    .tab { font-size: 3.4cqw; padding: 1cqw 1.8cqw; }
    .pager button { font-size: 3.6cqw; padding: 1cqw 2.4cqw; }
    .pager .pinfo { min-width: 26cqw; }
    .card { flex-wrap: wrap; }
    .card .lc-url { flex-basis: 100%; }
    .card .lc-name { max-width: 100%; }
  }
  @media (min-width: 501px) and (max-width: 900px) {
    .wrap { width: min(720px, 100%); }
    .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  @media (min-width: 901px) {
    .wrap { width: min(960px, 100%); }
    .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  }
</style>
</head>

  <div class="wrap">
    <div class="head">
      <h1>网址推荐</h1>
      <span class="mode on" id="mode">云端共享</span>
    </div>

    <div class="form">
      <input id="name" maxlength="30" placeholder="名称（≤30 字）">
      <input id="url" placeholder="网址 https://…">
      <button id="add" type="button">添加</button>
    </div>

    <div class="search">
      <input id="search" type="search" placeholder="搜索名称 / 网址 / 简介 / 分类…" autocomplete="off">
    </div>
    <div class="err" id="err"></div>

    <div class="tabs" id="tabs"></div>
    <div class="pager" id="pager">
      <button id="prev" type="button">‹ 上一类</button>
      <span class="pinfo" id="pinfo"></span>
      <button id="next" type="button">下一类 ›</button>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">添加即自动检查 · 自动归类到对应分组 · 翻页或搜索查看 · 点名称在新标签打开</div>
  </div>

  var BLACKLIST = ['赌博', '博彩', '赌场', '彩票', '时时彩', '六合彩', '色情', '成人', '淫秽', '黄色', '嫖娼',

  function $(id) { return document.getElementById(id); }

  var list = [];
  var mode = 'shared';

  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
  function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

  function loadLocal() { var v = loadJSON(LS_KEY); return Array.isArray(v) ? v : []; }

  function uid() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- 存储层：共享 KV 优先，失败降级 localStorage ---------- */
  var LinksStore = {
    async get() {
      try {
        var r = await fetch(API, { headers: { 'Accept': 'application/json' } });
        if (!r.ok) throw new Error('api ' + r.status);
        var data = await r.json();
        var items = Array.isArray(data && data.items) ? data.items : [];
        // 服务端返回空（KV 为空或旧版函数）时回退到内嵌预置，保证基础条目始终可见
        list = items.length ? items : clonePreset();
        mode = 'shared';
      } catch (e) {
      list = loadLocal();
      if (!list.length) list = clonePreset();
        mode = 'local';
      }
    },
    async add(item) {
      try {
        var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: item.name, url: item.url, cat: item.cat }) });
        if (!r.ok) throw new Error('post ' + r.status);
        var data = await r.json();
        if (data && Array.isArray(data.items)) { list = data.items; }
        mode = 'shared';
        return true;
      } catch (e) {
        list.push(item);
        saveJSON(LS_KEY, list);
        mode = 'local';
        return false;
      }
    },
    async remove(id) {
      try {
        var r = await fetch(API + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
        if (r.ok) {
          var data = await r.json();
          if (data && Array.isArray(data.items)) { list = data.items; }
          mode = 'shared';
          return;
        }
        throw new Error('del ' + r.status);
      } catch (e) {
        list = list.filter(function (x) { return x.id !== id; });
        saveJSON(LS_KEY, list);
        mode = 'local';
      }
    }
  };

  function clonePreset() { return PRESETS.map(function (x) { return JSON.parse(JSON.stringify(x)); }); }

  /* 固定分类顺序（取自预置，保证翻页结构稳定：即使某类为空也仍占一页） */
  var CAT_ORDER = [];
  (function () {
    PRESETS.forEach(function (p) { if (CAT_ORDER.indexOf(p.cat) < 0) CAT_ORDER.push(p.cat); });
  })();

  /* ---------- 渲染：分页，每个分类单独一页 ---------- */
  var currentPage = 0;
  var query = '';

  function getOrder() {
    var groups = {};
    list.forEach(function (it) {
      var c = it.cat || '未分类';
      (groups[c] = groups[c] || []).push(it);
    });
    /* 固定 11 类始终占页，外加数据里出现的其它分类 */
    var order = CAT_ORDER.slice();
    Object.keys(groups).forEach(function (c) { if (order.indexOf(c) < 0) order.push(c); });
    return order;
  }

  function render() {
    var modeEl = $('mode');
    modeEl.textContent = mode === 'shared' ? '云端共享' : '本地模式';
    modeEl.className = 'mode ' + (mode === 'shared' ? 'on' : 'off');

    var tabs = $('tabs');
    var pager = $('pager');
    var ul = $('list');
    ul.innerHTML = '';

    /* ---------- 搜索模式：跨分类过滤，按分类分组展示 ---------- */
    if (query) {
      tabs.style.display = 'none';
      pager.style.display = 'none';

      var matched = list.filter(function (it) {
        var hay = (it.name + ' ' + it.url + ' ' + (it.desc || '') + ' ' + (it.cat || '')).toLowerCase();
        return hay.indexOf(query) >= 0;
      });

      var head = document.createElement('div');
      head.className = 'result-head';
      head.appendChild(document.createTextNode('搜索「'));
      var b = document.createElement('b'); b.textContent = query; head.appendChild(b);
      head.appendChild(document.createTextNode('」共 ' + matched.length + ' 条'));
      ul.appendChild(head);

      if (!matched.length) {
        var empty0 = document.createElement('div');
        empty0.className = 'empty';
        empty0.textContent = '未找到匹配的网址';
        ul.appendChild(empty0);
        return;
      }

      var groups = {};
      matched.forEach(function (it) {
        var c = it.cat || '未分类';
        (groups[c] = groups[c] || []).push(it);
      });
      var qorder = CAT_ORDER.slice();
      Object.keys(groups).forEach(function (c) { if (qorder.indexOf(c) < 0) qorder.push(c); });

      qorder.forEach(function (c) {
        if (!groups[c]) return;
        var g = document.createElement('div'); g.className = 'rgroup';
        var gh = document.createElement('div');
        gh.className = 'rgroup-h';
        gh.textContent = c + '（' + groups[c].length + '）';
        g.appendChild(gh);
        var grid = document.createElement('div'); grid.className = 'grid';
        groups[c].forEach(function (it) { grid.appendChild(buildCard(it)); });
        g.appendChild(grid);
        ul.appendChild(g);
      });
      return;
    }

    /* ---------- 翻页模式 ---------- */
    tabs.style.display = '';
    pager.style.display = '';

    var order = getOrder();
    if (currentPage > order.length - 1) currentPage = order.length - 1;
    if (currentPage < 0) currentPage = 0;

    /* 按分类分组 */
    var groups = {};
    list.forEach(function (it) {
      var c = it.cat || '未分类';
      (groups[c] = groups[c] || []).push(it);
    });

    /* 分类标签 */
    tabs.innerHTML = '';
    order.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (i === currentPage ? ' active' : '');
      b.textContent = c + '（' + (groups[c] ? groups[c].length : 0) + '）';
      b.addEventListener('click', function () { currentPage = i; render(); });
      tabs.appendChild(b);
    });

    /* 翻页条 */
    $('pinfo').textContent = '第 ' + (currentPage + 1) + ' / ' + order.length + ' 类';
    $('prev').disabled = currentPage === 0;
    $('next').disabled = currentPage === order.length - 1;

    /* 当前页卡片网格 */
    var grid = document.createElement('div');
    grid.className = 'grid';
    var cur = order[currentPage];
    var items = groups[cur] || [];
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '该分类暂无网址';
      grid.appendChild(empty);
    } else {
      items.forEach(function (it) { grid.appendChild(buildCard(it)); });
    }
    ul.appendChild(grid);
  }

  function buildCard(it) {
    var card = document.createElement('div');
    card.className = 'card';

    var row = document.createElement('div');
    row.className = 'lc-row';

    var nm = document.createElement('a');
    nm.className = 'lc-name';
    nm.textContent = it.name;
    nm.href = it.url;
    nm.target = '_blank';
    nm.rel = 'noopener noreferrer';

    var ur = document.createElement('span');
    ur.className = 'lc-url';
    ur.textContent = it.url;

    row.appendChild(nm);
    row.appendChild(ur);

    if (it.pending) {
      var b = document.createElement('span');
      b.className = 'lc-pending';
      b.textContent = '待验证';
      row.appendChild(b);
    }

    /* 删除：仅「我的游戏合集 ming-games」锁死不可删，其余预置 + 自建均可删 */
    if (!it.locked) {
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'lc-del';
      del.textContent = '删除';
      del.addEventListener('click', function () { LinksStore.remove(it.id).then(render); });
      row.appendChild(del);
    }

    card.appendChild(row);

    if (it.desc) {
      var d = document.createElement('div');
      d.className = 'lc-desc';
      d.textContent = it.desc;
      card.appendChild(d);
    }

    return card;
  }

  /* ---------- 自动自检 ---------- */
  function validate(name, url) {
    if (!name) return '请填写名称';
    if (name.length > 30) return '名称最多 30 字';
    if (!url) return '请填写网址';
    var u;
    try { u = new URL(url); } catch (e) { return '网址格式不正确'; }
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '只支持 http / https 链接';
    for (var i = 0; i < BLACKLIST.length; i++) {
      if (name.indexOf(BLACKLIST[i]) >= 0 || url.indexOf(BLACKLIST[i]) >= 0) {
        return '内容包含违禁词：' + BLACKLIST[i];
      }
    }
    for (var j = 0; j < list.length; j++) {
      if (list[j].url === url) return '该网址已在列表中';
    }
    return null;
  }

  function reachable(url) {
    return new Promise(function (resolve) {
      var done = false;
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function () { done = true; if (ctrl) ctrl.abort(); resolve(false); }, 5000);
      fetch(url, { mode: 'no-cors', signal: ctrl ? ctrl.signal : undefined })
        .then(function () { if (!done) resolve(true); })
        .catch(function () { if (!done) resolve(false); })
        .finally(function () { clearTimeout(timer); });
    });
  }

  /* 自动归类：① 域名命中已有预置 → 直接沿用其分类（最准）；② 否则按关键词规则分到 11 类之一 */
  var AUTO_RULES = [
    ['📺 视频与音乐', ['youtube','bilibili','哔哩','b站','netflix','spotify','网易云','movie','电影','番剧','anime','tiktok','douyin','抖音','直播','听歌','剧集','影视','hbo','disney','爱奇艺','优酷','腾讯视频']],

    ['🎮 游戏与娱乐', ['steam','游戏','game','主机','掌机','桌游','boardgame','手游','电玩','nintendo','playstation','xbox','攻略']],

    ['📊 数据与可视化', ['可视化','visualization','tableau','powerbi','图表','chart','数据','excel','表格','spreadsheet','数据库','database','sql','统计','statistics','分析','analytics','仪表盘','dashboard','大数据']],
    ['🎨 设计与素材', ['figma','sketch','canva','dribbble','behance','设计','design','ui','ux','icon','图标','素材','图片','字体','font','插画','illustration','配色','color','渐变','gradient','unsplash','pexels','摄影','logo','海报','poster','矢量','vector']],
    ['💻 开发与调试工具', ['github','gitlab','postman','docker','kubernetes','linux','nginx','运维','debug','调试','开发','sdk','mdn','stackoverflow','w3schools','文档','docs','cli','terminal','正则','regex','接口','api','服务器','server','部署','deploy','前端','后端','devops']],

    ['🔍 导航与聚合', ['导航','聚合','导航站','首页','合集','大全','directory','awesome','资源','resource','网站导航','hao123','论坛','forum','社区','community','群组','购物','电商','淘宝','京东','亚马逊','地图','map','taobao','jd.com','tmall','mall','shop','amazon','ebay','ecommerce']]
  ];
  function autoCat(name, url) {
    var s = (name + ' ' + url).toLowerCase();
    try {
      var host = new URL(url).hostname.replace(/^www\./, '');
      for (var i = 0; i < PRESETS.length; i++) {
        try {
          var ph = new URL(PRESETS[i].url).hostname.replace(/^www\./, '');
          if (ph && (host === ph || host.endsWith('.' + ph) || ph.endsWith('.' + host))) return PRESETS[i].cat;
        } catch (e) {}
      }
    } catch (e) {}
    for (var j = 0; j < AUTO_RULES.length; j++) {
      var ks = AUTO_RULES[j][1];
      for (var k = 0; k < ks.length; k++) {
        if (s.indexOf(ks[k].toLowerCase()) >= 0) return AUTO_RULES[j][0];
      }
    }
    return '未分类';
  }

  async function onAdd() {
    var name = $('name').value.trim();
    var url = $('url').value.trim();
    var err = validate(name, url);
    $('err').textContent = err || '';
    if (err) return;

    var pending = !(await reachable(url));
    var item = { id: uid(), name: name, url: url, desc: '', cat: autoCat(name, url), pending: pending };

    await LinksStore.add(item);
    $('name').value = '';
    $('url').value = '';
    /* 跳到新网址所属分类那一页 */
    var order = getOrder();
    var idx = order.indexOf(item.cat);
    if (idx >= 0) currentPage = idx;
    render();
  }

  $('add').addEventListener('click', onAdd);
  $('prev').addEventListener('click', function () { if (currentPage > 0) { currentPage--; render(); } });
  $('next').addEventListener('click', function () { currentPage++; render(); });
  $('search').addEventListener('input', function () {
    query = $('search').value.trim().toLowerCase();
    render();
  });
  $('search').addEventListener('keydown', function (e) { if (e.key === 'Escape') { this.value = ''; query = ''; render(); } });
  LinksStore.get().then(render);
})();
