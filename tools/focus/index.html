<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专注模式 · 世界大厅</title>
<style>
:root{--ink:#0b1014;--paper:#f4e8d6;--dim:rgba(244,232,214,.5);--teal:#7fd8c8;--amber:#f0a76e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080c10;color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(90% 80% at 20% 0%,#173033 0,transparent 65%),radial-gradient(80% 70% at 100% 100%,#2b1d27 0,transparent 70%),#080c10}
.app{width:min(1040px,100%)}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(127,216,200,.18)}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.14em}header p{margin:6px 0 0;color:var(--dim);font-size:12px;letter-spacing:.12em}.state{color:var(--teal);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.card{border:1px solid rgba(127,216,200,.16);border-radius:20px;background:linear-gradient(180deg,rgba(24,39,42,.84),rgba(10,16,21,.9));padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.clock{text-align:center}.presets{display:flex;justify-content:center;gap:8px;margin-bottom:20px}.preset,.action,.noise-toggle{border:1px solid rgba(127,216,200,.25);background:transparent;color:var(--paper);font:inherit;cursor:pointer;border-radius:999px;min-height:44px;padding:8px 16px}.preset.on{color:#10201f;background:var(--teal);border-color:var(--teal)}
.time{font-variant-numeric:tabular-nums;font-size:clamp(64px,10vw,104px);font-weight:300;line-height:1;letter-spacing:.04em}.caption{margin:10px 0 22px;color:var(--dim);font-size:12px;letter-spacing:.18em}.actions{display:flex;justify-content:center;gap:10px}.action{min-width:126px}.action.primary{background:var(--amber);border-color:var(--amber);color:#24150e;font-weight:600}.action:disabled{opacity:.4;cursor:default}
h2{margin:0 0 18px;font-size:14px;font-weight:500;letter-spacing:.18em;color:var(--teal)}.noise-toggle{width:100%;font-size:15px}.noise-toggle.on{background:rgba(127,216,200,.14);border-color:var(--teal);color:#c9fff3}
label.slider{display:block;margin-top:20px}label.slider span{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:9px}input[type=range]{width:100%;accent-color:var(--teal);min-height:24px}
.note-label{display:block;margin-top:24px;font-size:12px;color:var(--dim)}textarea{width:100%;height:80px;resize:vertical;margin-top:8px;padding:12px;border-radius:12px;border:1px solid rgba(244,232,214,.14);background:rgba(0,0,0,.16);color:var(--paper);font:inherit;font-size:13px;line-height:1.6;outline:none}textarea:focus{border-color:rgba(127,216,200,.6)}
.hint{margin:14px 0 0;color:rgba(244,232,214,.35);font-size:11px;line-height:1.6}
@media(max-width:700px){body{padding:16px;align-items:flex-start}.grid{grid-template-columns:1fr}.card{padding:20px}header{align-items:start}.time{font-size:72px}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>专注模式</h1><p>番茄钟与棕噪音，一次开启</p></div><span class="state" id="state">准备好就开始</span></header>
<div class="grid">
<section class="card clock" aria-label="专注计时">
<div class="presets" role="group" aria-label="选择专注时长">
<button class="preset on" data-min="25" type="button">25 分钟</button><button class="preset" data-min="50" type="button">50 分钟</button><button class="preset" data-min="90" type="button">90 分钟</button>
</div>
<div class="time" id="time" aria-live="polite">25:00</div>
<p class="caption">保持这一件事，其他稍后再说</p>
<div class="actions"><button class="action primary" id="start" type="button">开始专注</button><button class="action" id="reset" type="button">重置</button></div>
</section>
<section class="card" aria-label="棕噪音与便签">
<h2>棕噪音</h2>
<button class="noise-toggle" id="noise" type="button" aria-pressed="false">开启背景声</button>
<label class="slider"><span>音量 <b id="volText">35%</b></span><input id="volume" type="range" min="0" max="100" value="35" aria-label="背景声音量"></label>
<label class="slider"><span>温暖度 <b id="warmText">60%</b></span><input id="warmth" type="range" min="0" max="100" value="60" aria-label="背景声温暖度"></label>
<label class="note-label">本轮要做的事<textarea id="note" placeholder="写下一件具体的小事，关掉页面也会保留。"></textarea></label>
<p class="hint">开始专注会同时启动计时与背景声；也可以只开背景声。计时结束会播放一声轻提示。</p>
</section>
</div>
</main>
<script>
(function(){
'use strict';
var duration=25*60,remaining=duration,running=false,endAt=0,timer=0;
var timeEl=document.getElementById('time'),startBtn=document.getElementById('start'),stateEl=document.getElementById('state');
var noiseBtn=document.getElementById('noise'),note=document.getElementById('note');
var ac=null,source=null,gain=null,filter=null,noiseOn=false;
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paint(){timeEl.textContent=fmt(remaining);document.title=(running?fmt(remaining)+' · ':'')+'专注模式 · 世界大厅'}
function audioInit(){
  if(ac)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();var len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var white=Math.random()*2-1;last=(last+.02*white)/1.02;data[i]=last*3.5}
  source=ac.createBufferSource();source.buffer=buf;source.loop=true;
  filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=600+Number(document.getElementById('warmth').value)*14;
  gain=ac.createGain();gain.gain.value=0;source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start();
}
function setNoise(on){
  noiseOn=on;audioInit();if(!ac){stateEl.textContent='当前浏览器不支持背景声';return}
  if(ac.state==='suspended')ac.resume();
  gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setTargetAtTime(on?Number(document.getElementById('volume').value)/100*.34:0,ac.currentTime,.08);
  noiseBtn.classList.toggle('on',on);noiseBtn.setAttribute('aria-pressed',on?'true':'false');noiseBtn.textContent=on?'背景声已开启':'开启背景声';
}
function beep(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=528;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1)}
function tick(){if(!running)return;remaining=Math.max(0,(endAt-Date.now())/1000);paint();if(remaining<=0){running=false;clearInterval(timer);startBtn.textContent='开始专注';stateEl.textContent='本轮完成，休息一下';setNoise(false);beep()}}
function start(){
  if(running){running=false;clearInterval(timer);startBtn.textContent='继续专注';stateEl.textContent='已暂停';setNoise(false);paint();return}
  if(remaining<=0)remaining=duration;running=true;endAt=Date.now()+remaining*1000;startBtn.textContent='暂停';stateEl.textContent='正在专注';setNoise(true);timer=setInterval(tick,250);paint();
}
function reset(){running=false;clearInterval(timer);remaining=duration;startBtn.textContent='开始专注';stateEl.textContent='准备好就开始';setNoise(false);paint()}
document.querySelectorAll('.preset').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.preset').forEach(function(x){x.classList.remove('on')});b.classList.add('on');duration=Number(b.dataset.min)*60;reset()})});
startBtn.addEventListener('click',start);document.getElementById('reset').addEventListener('click',reset);noiseBtn.addEventListener('click',function(){setNoise(!noiseOn)});
document.getElementById('volume').addEventListener('input',function(){document.getElementById('volText').textContent=this.value+'%';if(gain&&noiseOn)gain.gain.setTargetAtTime(Number(this.value)/100*.34,ac.currentTime,.05)});
document.getElementById('warmth').addEventListener('input',function(){document.getElementById('warmText').textContent=this.value+'%';if(filter)filter.frequency.setTargetAtTime(600+Number(this.value)*14,ac.currentTime,.05)});
try{note.value=localStorage.getItem('worldhub.focus.note')||''}catch(e){}note.addEventListener('input',function(){try{localStorage.setItem('worldhub.focus.note',note.value)}catch(e){}});
window.addEventListener('beforeunload',function(){clearInterval(timer)});paint();
})();
</script>
</body>
</html>
