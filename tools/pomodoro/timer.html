<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>番茄钟 🍅</title>

  <style>/* Quicksand 缺席时的兜底，与 timer.css 的 font-family 顺序一致 */
    body { font-family: "Quicksand", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }</style>
  <link rel="stylesheet" href="timer.css">

  <meta name="theme-color" content="#e0a0a8">

  <link rel="apple-touch-icon" href="icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!-- 主卡片 -->
  <div class="card">

    <!-- 通知铃铛（左上角） -->
    <button class="btn-bell" id="btnNotification" onclick="requestNotificationPermission()">🔕</button>

    <!-- 猫咪伴侣入口（左上角，铃铛旁） -->
    <a class="btn-cat" href="pet.html" title="猫咪伴侣 🐱">🐱</a>

    <!-- 全屏按钮（右上角，⚙ 左侧） -->
    <button class="btn-fullscreen" id="btnFullscreen" onclick="toggleFullscreen()" title="全屏专注">
      <svg id="iconFullscreen" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 5V1H5M9 1H13V5M13 9V13H9M5 13H1V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 设置按钮（右上角） -->
    <button class="btn-settings" id="btnSettings" onclick="toggleSettings()">⚙</button>

    <!-- 设置面板（默认隐藏） -->
    <div class="settings-panel" id="settingsPanel">

      <div class="settings-row">
        <label for="inputFocus">专注</label>
        <input type="number" id="inputFocus" value="25" min="1" max="60" />
        <span>分钟</span>
      </div>

      <div class="settings-row">
        <label for="inputBreak">短休息</label>
        <input type="number" id="inputBreak" value="5" min="1" max="30" />
        <span>分钟</span>
      </div>

      <div class="settings-row">
        <label for="inputLongBreak">长休息</label>
        <input type="number" id="inputLongBreak" value="15" min="5" max="60" />
        <span>分钟</span>
      </div>

      <div class="settings-row">
        <label for="inputGoal">每日目标</label>
        <input type="number" id="inputGoal" value="8" min="1" max="20" />
        <span>🍅</span>
      </div>

      <!-- 错误提示区（默认为空，验证失败时填充） -->
      <div class="settings-error" id="settingsError"></div>

      <button class="btn-apply" onclick="applySettings()">应用</button>

    </div><!-- end .settings-panel -->

    <!-- 通知权限提示（首次访问显示） -->
    <div class="notif-prompt" id="notifPrompt">
      <span class="notif-prompt-text">🔔 允许通知吗？计时结束时会提醒你。</span>
      <div class="notif-prompt-btns">
        <button class="notif-prompt-skip" onclick="skipNotifPrompt()">稍后</button>
        <button class="notif-prompt-allow" onclick="allowNotifPrompt()">允许 🔔</button>
      </div>
    </div>

    <!-- 猫咪图片（按计时器状态通过 CSS 切换） -->
    <div class="cat-wrapper">
      <img class="cat-image cat-idle" src="cats/idle-cat.png" alt="" aria-hidden="true">
      <img class="cat-image cat-focus" src="cats/focus-cat.png" alt="" aria-hidden="true">
      <img class="cat-image cat-short-break" src="cats/shortbreak-cat.png" alt="" aria-hidden="true">
      <img class="cat-image cat-long-break" src="cats/longbreak-cat.png" alt="" aria-hidden="true">
      <img class="cat-image cat-paused" src="cats/paused-cat.png" alt="" aria-hidden="true">
      <img class="cat-image cat-done" src="cats/done-cat.png" alt="" aria-hidden="true">
    </div>

    <!-- 模式标签（显示“专注”或“短休息”） -->
    <div class="mode-label" id="modeLabel">专注</div>

    <!-- 当前任务显示（用户钉选任务后显示） -->
    <div class="active-task-display" id="activeTaskDisplay">
      <span>📌</span>
      <span id="activeTaskText"></span>
      <button class="active-task-clear" onclick="clearActiveTask()">✕</button>
    </div>

    <!-- 计时器显示（如 25:00） -->
    <div class="timer-display" id="timerDisplay">25:00</div>

    <!-- 进度条 -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 回合计数器（如“第 1 回合 / 共 4”） -->
    <div class="round-info" id="roundInfo">第 1 回合 / 共 4</div>

    <!-- 会话统计行：今日次数 + 连续天数 + 每日目标 -->
    <div class="session-stats-row">
      <div class="pomodoro-count" id="pomodoroCount">🍅 × 0</div>
      <div class="streak-count"   id="streakCount">🔥 × 0</div>
      <div class="goal-count"     id="goalCount">🎯 0 / 8</div>
    </div>

    <!-- 按钮区 -->
    <div class="controls">

      <!-- 开始按钮 -->
      <button class="btn btn-start" id="btnStart" onclick="startTimer()">
        ▶ 开始
      </button>

      <!-- 暂停按钮（默认禁用） -->
      <button class="btn btn-pause" id="btnPause" onclick="pauseTimer()" disabled>
        ⏸ 暂停
      </button>

      <!-- 重置按钮 -->
      <button class="btn btn-reset" onclick="resetTimer()">
        ↺ 重置
      </button>

    </div><!-- end .controls -->

    <!-- 状态消息 -->
    <div class="status-message" id="statusMessage">
      点击“开始”开始专注会话。
    </div>

    <!-- 环境音控制 -->
    <div class="ambient-section">
      <span class="ambient-label">🎧 环境音</span>
      <div class="ambient-grid">
        <button class="btn-ambient active" id="ambientOff" onclick="setAmbient('off')" title="静音">🔇</button>
        <button class="btn-ambient" id="ambientOcean" onclick="setAmbient('ocean')" title="海浪">🌊</button>
        <button class="btn-ambient" id="ambientRain" onclick="setAmbient('rain')" title="雨声 + 钢琴">🌧</button>
        <button class="btn-ambient" id="ambientForest" onclick="setAmbient('forest')" title="森林 + 钢琴">🌲</button>
        <button class="btn-ambient" id="ambientLofi" onclick="setAmbient('lofi')" title="Lo-fi 音乐">🎵</button>
        <button class="btn-ambient" id="ambientJazz1" onclick="setAmbient('jazz1')" title="爵士混音 1">🎷</button>
        <button class="btn-ambient" id="ambientJazz2" onclick="setAmbient('jazz2')" title="爵士混音 2">🎸</button>
      </div>

      <!-- 音频播放器（选中环境音后显示） -->
      <div class="audio-player" id="audioPlayer">
        <div class="audio-header">
          <span class="audio-emoji" id="audioEmoji"></span>
          <span class="audio-name" id="audioName"></span>
          <button class="audio-playpause-btn" id="audioPauseBtn" onclick="toggleAudioPlayback()" title="播放 / 暂停">⏸</button>
        </div>
        <div class="audio-progress-track" id="audioProgressTrack" onclick="seekAudio(event)" title="点击跳转">
          <div class="audio-progress-fill" id="audioProgressBar"></div>
        </div>
        <div class="audio-time-row">
          <span id="audioCurrentTime">0:00</span>
          <span id="audioTotalTime">0:00</span>
        </div>
      </div>
    </div>

    <!-- 键盘提示（卡片底部，极淡） -->
    <div class="keyboard-hints">
      <kbd>空格</kbd> 开始 / 暂停
    </div>

  </div><!-- end .card -->

  <!-- 任务列表卡片 -->
  <div class="task-card">
    <div class="task-header">
      <span class="task-title">✏️ 今天的任务</span>
      <span class="task-count" id="taskCount">0 / 0</span>
    </div>

    <div class="task-input-row">
      <input type="text" class="task-input" id="taskInput" placeholder="你正在处理什么？✨" maxlength="60" />
      <button class="btn-add-task" id="btnAddTask" onclick="addTask()">+</button>
    </div>

    <div class="task-list" id="taskList">
      <div class="task-empty">✨ 暂无任务 — 点击上方添加！</div>
    </div>
  </div><!-- end .task-card -->

  <!-- 每周统计卡片 -->
  <div class="stats-card">
    <div class="stats-header">
      <span class="stats-title">📊 本周</span>
      <span class="week-total" id="weekTotal">0 次</span>
    </div>
    <canvas id="weeklyChart" width="296" height="110"></canvas>
  </div>

  <script src="timer.js"></script>

</body>
</html>
