<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    pet.html —— 猫咪伴侣小游戏页面
    与 timer.html 只通过 localStorage 通信：
      coins    —— 计时器赚取，这里消费
      petState —— 猫咪状态（饱食/心情/精力/等级/经验）
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>猫咪伴侣 🐱</title>

  <style>/* Quicksand 缺席时的兜底，与 timer.css 的 font-family 顺序一致 */
    body { font-family: "Quicksand", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }</style>

  <link rel="stylesheet" href="pet.css">
</head>

<body>
  <!-- ===================== 主卡片 ===================== -->
  <div class="card">

    <!-- 返回计时器（左上角，与铃铛位置一致） -->
    <a class="btn-focus" href="timer.html" title="返回计时器">⏱</a>

    <!-- 金币显示（顶部居中小胶囊） -->
    <div class="coin-display" id="coinDisplay">
      <span class="coin-icon">🪙</span>
      <span class="coin-amount" id="coinAmount">0</span>
      <span class="coin-label">金币</span>
    </div>

    <!-- 猫咪展示区 -->
    <div class="cat-area">
      <div class="cat-wrapper">
        <!-- 对话气泡：JS 按猫咪状态设置文字 -->
        <div class="speech-bubble" id="speechBubble"></div>
        <!-- 背景层：穿戴背景时由 JS 设置渐变 -->
        <div class="cat-bg" id="catBg"></div>
        <img
          class="pet-cat-img"
          id="petCatImg"
          src="cats/idle-cat.png"
          alt=""
          aria-hidden="true"
        >
        <!-- 睡眠气泡：仅睡眠时显示 -->
        <div class="zzz-cue" id="zzzCue">💤</div>
        <!-- 猫窝：仅睡眠时显示 -->
        <div class="acc-overlay acc-bed" id="accBed"></div>
      </div>
    </div>

    <!-- 猫咪名字 + 等级 -->
    <div class="cat-identity">
      <span class="cat-name" id="catName">露娜</span>
      <button class="btn-rename" id="btnRename" onclick="startRename()" title="改名">✏️</button>
      <span class="cat-lv" id="catLv">等级 1</span>
    </div>

    <!-- 状态提示行 -->
    <div class="status-line" id="statusLine"></div>

    <!-- 经验条 -->
    <div class="exp-section">
      <div class="exp-track">
        <div class="exp-fill" id="expFill" style="width: 0%"></div>
      </div>
      <span class="exp-label" id="expLabel">0 / 100 经验</span>
    </div>

    <!-- 分隔线 -->
    <div class="section-divider"></div>

    <!-- 状态条（饱食 / 心情 / 精力） -->
    <div class="stats-section">

      <!-- 饱食度 -->
      <div class="stat-row">
        <span class="stat-icon">🍖</span>
        <span class="stat-name">饱食</span>
        <div class="stat-track">
          <div class="stat-fill stat-fullness" id="fillFullness" style="width: 80%"></div>
        </div>
        <span class="stat-val" id="valFullness">80</span>
      </div>

      <!-- 心情 -->
      <div class="stat-row">
        <span class="stat-icon">💗</span>
        <span class="stat-name">心情</span>
        <div class="stat-track">
          <div class="stat-fill stat-mood" id="fillMood" style="width: 70%"></div>
        </div>
        <span class="stat-val" id="valMood">70</span>
      </div>

      <!-- 精力 -->
      <div class="stat-row">
        <span class="stat-icon">⚡</span>
        <span class="stat-name">精力</span>
        <div class="stat-track">
          <div class="stat-fill stat-energy" id="fillEnergy" style="width: 90%"></div>
        </div>
        <span class="stat-val" id="valEnergy">90</span>
      </div>

    </div><!-- end .stats-section -->

    <!-- 动作按钮（喂食 / 玩耍 / 睡觉） -->
    <div class="action-row">
      <button class="btn-action btn-feed" id="btnFeed">🍖 喂食</button>
      <button class="btn-action btn-play" id="btnPlay">🎾 玩耍</button>
      <button class="btn-action btn-sleep" id="btnSleep">😴 睡觉</button>
    </div>

  </div><!-- end .card -->


  <!-- ===================== 标签页卡片 ===================== -->
  <div class="tab-card">

    <!-- 标签栏 -->
    <div class="tab-bar" id="tabBar">
      <button class="tab-btn active" data-tab="feed">🍖 食物</button>
      <button class="tab-btn" data-tab="shop">🛒 商店</button>
      <button class="tab-btn" data-tab="closet">👗 衣柜</button>
    </div>

    <!-- 标签内容 -->
    <div class="tab-content">

      <!-- 食物 -->
      <div class="tab-pane active" id="paneFeed">
        <p class="pane-empty">🐟 食物道具即将上架 — 先继续攒金币吧！</p>
      </div>

      <!-- 商店 -->
      <div class="tab-pane" id="paneShop">
        <p class="pane-empty">🛒 商店正在补货 — 过会儿再来看看！</p>
      </div>

      <!-- 衣柜 -->
      <div class="tab-pane" id="paneCloset">
        <p class="pane-empty">👗 还没有装扮 — 猫咪现在是最自然的模样！</p>
      </div>

    </div><!-- end .tab-content -->

  </div><!-- end .tab-card -->


  <!-- ===================== 脚本 ===================== -->
  <script src="pet.js"></script>

</body>
</html>
